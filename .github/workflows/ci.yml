name: Canvas CI

on:
  pull_request:
    branches: [1.x]
  push:
    branches: [1.x]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DDEV_NONINTERACTIVE: "true"

jobs:
  # ---- Standalone JS checks (no Drupal needed) -------------------------------
  # Mirrors GitLab's `lint (node)` + `vitest` jobs (node:24-alpine). All lint
  # tools (incl. the `yamllint` bin, which is the npm `yaml-lint` package) are
  # provided by npm, so ubuntu-latest + node 24 has full parity.
  node:
    name: Lint + Vitest (UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deps
        run: npm ci
      - name: Build UI
        run: npm run build --workspace=drupal-canvas
      - name: Lint (eslint/prettier/stylelint/tsc/cspell/yaml/openapi)
        run: npm run lint
      - name: Vitest (UI unit)
        run: npm run test --workspace=@drupal-canvas/ui

  # ---- Full Drupal build via ddev, then PHP + browser suites -----------------
  build:
    name: Build Drupal site (ddev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: canvas
      - name: Install ddev
        run: curl -fsSL https://ddev.com/install.sh | bash
      - name: Create Drupal 11.3 project with Canvas
        run: |
          mkdir site && cd site
          ddev config --project-type=drupal11 --docroot=web --php-version=8.4 \
            --database=mariadb:10.11 --nodejs-version=20 \
            --project-name=canvas-ci --performance-mode=none
          ddev start
          # Scaffold the project first (empty dir), THEN move the module source
          # INSIDE the project so ddev's container actually mounts it — a path
          # repo pointing outside the project dir is invisible in the container.
          ddev composer create-project "drupal/recommended-project:^11.3" --no-install
          mv ../canvas ./canvas
          ddev composer config minimum-stability dev
          ddev composer config --json repositories.canvas \
            '{"type":"path","url":"./canvas","options":{"symlink":true}}'
          ddev composer require "drupal/canvas:@dev" "drupal/core-dev:^11.3" -W --no-interaction
          # Install Canvas's own require-dev (phpstan/phpcs toolchain + the
          # contrib modules the static analysis and kernel/functional suites
          # need). Without this, phpstan/phpcs and many tests cannot run.
          ddev exec 'cd web/modules/contrib/canvas && composer run install-dev-deps'
          ddev drush site:install standard -y
          ddev drush pm:enable canvas canvas_dev_mode -y
          ddev exec 'test -d web/modules/contrib/canvas'
      - name: Tar the built site (keep .ddev so downstream jobs can start it)
        run: tar -czf site.tgz site
      - uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: site.tgz
          retention-days: 1

  static:
    name: phpcs + phpstan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: built-site }
      - run: tar -xzf site.tgz
      - name: Install ddev
        run: curl -fsSL https://ddev.com/install.sh | bash
      - name: phpcs + phpstan + validate
        run: |
          cd site && ddev start
          ddev exec 'cd web/modules/contrib/canvas && composer validate --strict || true'
          ddev exec 'cd web/modules/contrib/canvas && composer run lint:phpcs'
          ddev exec 'cd web/modules/contrib/canvas && composer run lint:phpstan'

  phpunit:
    name: PHPUnit (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full Unit suite (fast, must be green).
          - suite: Unit
            args: "--types PHPUnit-Unit"
          # Kernel/Functional scoped to a small sub-dir so the jobs demonstrate
          # the suites *executing* via run-tests.sh without a multi-hour run.
          - suite: Kernel
            args: "--types PHPUnit-Kernel tests/src/Kernel/Config"
          - suite: Functional
            args: "--types PHPUnit-Functional tests/src/Functional/Config"
    steps:
      - uses: actions/download-artifact@v4
        with: { name: built-site }
      - run: tar -xzf site.tgz
      - name: Install ddev
        run: curl -fsSL https://ddev.com/install.sh | bash
      - name: Run PHPUnit-${{ matrix.suite }}
        run: |
          cd site && ddev start
          ddev exec 'cd web/modules/contrib/canvas && composer run phpunit -- ${{ matrix.args }}'

  browser:
    name: ${{ matrix.tool }} (headless)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [playwright, cypress]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: built-site }
      - run: tar -xzf site.tgz
      - name: Install ddev
        run: curl -fsSL https://ddev.com/install.sh | bash
      - name: Add headless-browser runtime libs, then start + build UI
        run: |
          cd site
          # Chromium (Playwright) + Electron (Cypress) headless runtime libs.
          mkdir -p .ddev
          cat > .ddev/config.browsers.yaml <<'YAML'
          webimage_extra_packages: [chromium, libgtk-3-0, libnss3, libasound2t64, libxtst6, libgbm1, libxss1, libatk-bridge2.0-0, libatspi2.0-0, libcups2, libdrm2, libxkbcommon0, libpango-1.0-0, fonts-liberation, xvfb, xauth]
          YAML
          ddev start
          ddev exec 'cd web/modules/contrib/canvas && npm ci && npm run build --workspace=drupal-canvas'
      - name: Playwright (one spec, headless chromium)
        if: matrix.tool == 'playwright'
        run: |
          cd site
          ddev exec 'cd web/modules/contrib/canvas && npx playwright install chromium && \
            DRUPAL_TEST_BASE_URL=$DDEV_PRIMARY_URL \
            DRUPAL_TEST_DB_URL=$DDEV_DATABASE_FAMILY://db:db@db/db \
            npx playwright test --project=chromium tests/src/Playwright/tests/isolatedPerTest/canaryMinimal.spec.ts'
      - name: Cypress (one spec, headless electron)
        if: matrix.tool == 'cypress'
        run: |
          cd site
          ddev exec 'cd web/modules/contrib/canvas/ui && npx cypress install && \
            BASE_URL=$DDEV_PRIMARY_URL \
            DB_URL=$DDEV_DATABASE_FAMILY://db:db@db/db \
            npx cypress run --browser electron --spec tests/e2e/canary.cy.js'
