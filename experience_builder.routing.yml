experience_builder.experience_builder:
  path: '/xb/{entity_type}/{entity}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ExperienceBuilderController'
    _title: 'Experience Builder'
    entity: NULL
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      entity:
        type: entity:{entity_type}

experience_builder.api.components:
  path: '/xb-components'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiComponentsController'
    _title: 'Components'
  requirements:
    _permission: 'access administration pages'

experience_builder.api.layout:
  path: '/api/layout/{entity_type}/{entity}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiLayoutController'
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      entity:
        type: entity:{entity_type}

experience_builder.api.content.update:
  path: '/xb/api/content-update/{entity_type}/{entity}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiContentUpdateForDemoController'
  requirements:
    _permission: 'access administration pages'
  methods: ['PATCH']
  options:
    parameters:
      entity:
        type: entity:{entity_type}

experience_builder.api.preview:
  path: '/api/preview/{entity_type}/{entity}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiPreviewController'
    _title_callback: 'Drupal\experience_builder\Controller\ApiPreviewController::getLabel'
  requirements:
    _permission: 'access administration pages'
  options:
    # The XB equivalent of requesting an AJAX response using `?_wrapper_format`.
    # @see Drupal.Ajax.AJAX_REQUEST_PARAMETER
    # @see \Drupal\Core\Ajax\AjaxResponse
    # @see \Drupal\experience_builder\Render\MainContent\XBPreviewRenderer
    _wrapper_format: xb_preview
    parameters:
      entity:
        type: entity:{entity_type}

experience_builder.api.autosave_collection:
  path: '/xb/api/autosave'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiPendingChangesController'
  requirements:
    _permission: 'access administration pages'

entity.component.delete_form:
  path: '/admin/structure/component/delete/{component}'
  defaults:
    _entity_form: 'component.delete'
    _title: 'Delete component'
  requirements:
    _entity_access: 'component.delete'

experience_builder.api.component_props_form:
  path: '/xb-field-form/{entity_type}/{entity}'
  defaults:
    _form: '\Drupal\experience_builder\Form\ComponentPropsForm'
    _title: 'Component Props Form'
  requirements:
    _permission: 'access administration pages'
  options:
    # The XB equivalent of requesting an AJAX response using `?_wrapper_format`.
    # @see Drupal.Ajax.AJAX_REQUEST_PARAMETER
    # @see \Drupal\Core\Ajax\AjaxResponse
    # @see \Drupal\experience_builder\Render\MainContent\XBTemplateRenderer
    _wrapper_format: 'xb_template'
    parameters:
      entity:
        type: entity:{entity_type}

experience_builder.api.entity_form:
  path: '/xb/api/entity-form/{entity_type}/{entity}/{entity_form_mode}'
  defaults:
    # It is not possible to use '_entity_form' as a default because form mode is not taken into account.
    # When '_entity_form' is used as a default with 2 parts, for example 'node.default', the 2nd part is the form
    # operation, not form mode.
    # @see \Drupal\Core\Entity\Enhancer\EntityRouteEnhancer::enhanceEntityForm
    # @see \Drupal\Core\Entity\HtmlEntityFormController::getFormObject
    _controller: '\Drupal\experience_builder\Controller\EntityFormController::form'
    _title: 'Entity Form'
    entity_form_mode: default
  requirements:
    _permission: 'access administration pages'
  options:
    # The XB equivalent of requesting an AJAX response using `?_wrapper_format`.
    # @see Drupal.Ajax.AJAX_REQUEST_PARAMETER
    # @see \Drupal\Core\Ajax\AjaxResponse
    # @see \Drupal\experience_builder\Render\MainContent\XBTemplateRenderer
    _wrapper_format: 'xb_template'
    parameters:
      entity:
        type: entity:{entity_type}

experience_builder.api.log_error:
  path: '/xb/api/log-error'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiLogController'
  requirements:
    _permission: 'access administration pages'
  methods: ['POST']

experience_builder.api.config.list:
  path: '/xb/api/config/{xb_config_entity_type_id}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiConfigControllers::list'
  requirements:
    _permission: 'access administration pages'
    xb_config_entity_type_id: '(page_template|pattern)'
  methods: [GET]
experience_builder.api.config.get:
  path: '/xb/api/config/{xb_config_entity_type_id}/{xb_config_entity}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiConfigControllers::get'
  requirements:
    _permission: 'access administration pages'
    xb_config_entity_type_id: '(page_template|pattern)'
  options:
    parameters:
      xb_config_entity:
        type: entity:{xb_config_entity_type_id}
  methods: [GET]
experience_builder.api.config.patch:
  path: '/xb/api/config/{xb_config_entity_type_id}/{xb_config_entity}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiConfigControllers::patch'
  requirements:
    _permission: 'access administration pages'
    xb_config_entity_type_id: '(page_template|pattern)'
  options:
    parameters:
      xb_config_entity:
        type: entity:{xb_config_entity_type_id}
  methods: [PATCH]
experience_builder.api.config.delete:
  path: '/xb/api/config/{xb_config_entity_type_id}/{xb_config_entity}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiConfigControllers::delete'
  requirements:
    _permission: 'access administration pages'
    xb_config_entity_type_id: '(page_template|pattern)'
  options:
    parameters:
      xb_config_entity:
        type: entity:{xb_config_entity_type_id}
  methods: [DELETE]
experience_builder.api.config.post:
  path: '/xb/api/config/{xb_config_entity_type_id}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiConfigControllers::post'
  requirements:
    _permission: 'access administration pages'
    xb_config_entity_type_id: '(page_template|pattern)'
  methods: [POST]

experience_builder.component.status:
  path: '/admin/structure/component/status'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ComponentStatusController'
    _title:  'Components status'
  requirements:
    _permission: 'access administration pages'

entity.component.enable:
  path: '/admin/structure/component/{component}/enable'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ComponentStatusController::performOperation'
    op: enable
  requirements:
    _entity_access: 'component.enable'
    _csrf_token: 'TRUE'

entity.component.disable:
  path: '/admin/structure/component/{component}/disable'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ComponentStatusController::performOperation'
    op: disable
  requirements:
    _entity_access: 'component.disable'
    _csrf_token: 'TRUE'

experience_builder.api.publish_all:
  path: '/xb/api/publish-all'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\ApiPublishAllController'
  requirements:
    _permission: 'access administration pages'
  methods: [POST]
