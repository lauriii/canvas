experience_builder.experience_builder:
  path: '/xb/{entity_type}/{entity}/{react_route}/{react_subroute}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ExperienceBuilderController'
    _title: 'Experience Builder'
    react_route: NULL
    react_subroute: NULL
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      react_route:
        type: string
      react_subroute:
        type: string
      entity:
        type: entity:{entity_type}

experience_builder.api.components:
  path: '/xb-components'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\SdcController::components'
    _title: 'Components'
  requirements:
    _permission: 'access administration pages'

experience_builder.api.component:
  path: '/xb-component/{component_id}'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\SdcController::component'
    _title: 'Component'
    component_id: NULL
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      component_id:
        type: string

experience_builder.api.render_component:
  path: '/xb-render-component/{component_id}'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\SdcController::renderComponent'
    _title: 'Render Component'
    component_id: NULL
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      component_id:
        type: string

experience_builder.api.layout:
  path: '/api/layout/{entity_type}/{entity}'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\SdcController::layout'
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      entity:
        type: entity:{entity_type}

experience_builder.api.preview:
  path: '/api/preview/{entity_type}/{entity}'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ApiPreviewController'
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      entity:
        type: entity:{entity_type}

entity.component.delete_form:
  path: '/admin/structure/component/delete/{component}'
  defaults:
    _entity_form: 'component.delete'
    _title: 'Delete component'
  requirements:
    _entity_access: 'component.delete'

experience_builder.api.component_props_form:
  path: '/xb-field-form/{entity_type}/{entity}'
  defaults:
    _form: '\Drupal\experience_builder\Form\ComponentPropsForm'
    _title: 'Component Props Form'
  requirements:
    _permission: 'access administration pages'
  options:
    # The XB equivalent of requesting an AJAX response using `?_wrapper_format`.
    # @see Drupal.Ajax.AJAX_REQUEST_PARAMETER
    # @see \Drupal\Core\Ajax\AjaxResponse
    # @see \Drupal\experience_builder\Render\MainContent\XBEndpointRenderer
    _wrapper_format: 'xb_endpoint'
    parameters:
      entity:
        type: entity:{entity_type}

experience_builder.api.entity_form:
  path: '/xb/api/entity-form/{entity_type}/{entity}/{entity_form_mode}'
  defaults:
    # It is not possible to use '_entity_form' as a default because form mode is not taken into account.
    # When '_entity_form' is used as a default with 2 parts, for example 'node.default', the 2nd part is the form
    # operation, not form mode.
    # @see \Drupal\Core\Entity\Enhancer\EntityRouteEnhancer::enhanceEntityForm
    # @see \Drupal\Core\Entity\HtmlEntityFormController::getFormObject
    _controller: '\Drupal\experience_builder\Controller\EntityFormController::form'
    _title: 'Entity Form'
    entity_form_mode: default
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      entity:
        type: entity:{entity_type}

experience_builder.component.status:
  path: '/admin/structure/component/status'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ComponentStatusController'
    _title:  'Components status'
  requirements:
    _permission: 'access administration pages'

entity.component.enable:
  path: '/admin/structure/component/{component}/enable'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ComponentStatusController::performOperation'
    op: enable
  requirements:
    _entity_access: 'component.enable'
    _csrf_token: 'TRUE'

entity.component.disable:
  path: '/admin/structure/component/{component}/disable'
  defaults:
    _controller: 'Drupal\experience_builder\Controller\ComponentStatusController::performOperation'
    op: disable
  requirements:
    _entity_access: 'component.disable'
    _csrf_token: 'TRUE'
