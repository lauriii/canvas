experience_builder.experience_builder:
  path: '/xb/{react_route}'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\ExperienceBuilderController::content'
    _title: 'Experience Builder'
    react_route: NULL
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      react_route:
        type: string

experience_builder.components:
  path: '/xb-components'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\SdcController::components'
    _title: 'Components'
  requirements:
    _permission: 'access administration pages'

experience_builder.component:
  path: '/xb-component/{component_id}'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\SdcController::component'
    _title: 'Component'
    component_id: NULL
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      component_id:
        type: string

experience_builder.render_component:
  path: '/xb-render-component/{component_id}'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\SdcController::renderComponent'
    _title: 'Render Component'
    component_id: NULL
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      component_id:
        type: string

experience_builder.layout:
  path: '/api/layout/1'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\SdcController::layout'
  requirements:
    _permission: 'access administration pages'

experience_builder.preview:
  path: '/api/preview'
  defaults:
    _controller: '\Drupal\experience_builder\Controller\SdcController::preview'
  requirements:
    _permission: 'access administration pages'

entity.component.form_add:
  path: '/admin/structure/component/add'
  defaults:
    _entity_form: 'component.add'
    _title: 'Add component'
  requirements:
    _entity_create_access: 'component'

entity.component.edit_form:
  path: '/admin/structure/component/edit/{component}'
  defaults:
    _entity_form: 'component.edit'
    _title: 'Edit component'
  requirements:
    _entity_access: 'component.update'

entity.component.delete_form:
  path: '/admin/structure/component/delete/{component}'
  defaults:
    _entity_form: 'component.delete'
    _title: 'Delete component'
  requirements:
    _entity_access: 'component.delete'

experience_builder.component_props_form:
  path: '/xb-field-form'
  defaults:
    _form: '\Drupal\experience_builder\Form\ComponentPropsForm'
    _title: 'Component Props Form'
  requirements:
    _permission: 'access administration pages'
