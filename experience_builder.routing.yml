experience_builder.experience_builder:
    path: '/admin/eb/{react_route}'
    defaults:
      _controller: '\Drupal\experience_builder\Controller\ExperienceBuilderController::content'
      _title: 'Experience Builder'
      react_route: NULL
    requirements:
      _permission: 'access administration pages'
    options:
      parameters:
        react_route:
          type: string
