# @see https://spec.openapis.org/oas/v3.1.0.html#components-object
components:
  # @see https://spec.openapis.org/oas/v3.1.0.html#schema-object
  schemas:
    Component:
      title: Component
      type: object
      required:
        - name
        - id
        - category
        - metadata
        - field_data
        - default_markup
      properties:
        name:
          type: string
          description: The component name
        id:
          type: string
          description: The component id
        category:
          type: string
          description: The component category
        # @see \Drupal\Core\Theme\Component\ComponentMetadata
        metadata:
          type: object
          description: SDC metadata
        field_data:
          type: object
          description: the StaticPropSources to use for each SDC prop
          # Keys are props for this SDC. Only required SDC props are required here.
          additionalProperties:
            type: object
            required:
              - sourceType
              - expression
              - required
            properties:
              sourceType:
                type: string
              expression:
                type: string
              required:
                type: boolean
              default_values:
                type:
                  - string
                  - integer
                  - number
                  - boolean
                  - object
        default_markup:
          type: string
          description: "without providing user input, this is what Component's markup would look like — used to preview the Component prior to placing it"
        dynamic_prop_source_candidates:
          type: object
          description: the DynamicPropSources that match each
      additionalProperties: false
    LayoutComponent:
      title: LayoutComponent
      type: object
      required:
        - nodeType
        - uuid
        - type
        - slots
      additionalProperties: false
      properties:
        nodeType:
          type: string
          enum:
            - component
          description: The layout node type
        uuid:
          type: string
          description: The UUID of the component instance
        type:
          type: string
        name:
          type: string
          description: The name of the component instance
        slots:
          type: array
          description: Array of slots
          items:
            $ref: '#/components/schemas/LayoutSlot'
    LayoutSlot:
      title: LayoutSlot
      type: object
      required:
        - nodeType
        - name
        - components
      additionalProperties: false
      properties:
        nodeType:
          type: string
          enum:
            - region
            - slot
          description: The layout node type
        id:
          type: string
          description: A unique identifier for the slot
        name:
          type: string
          description: The name of the slot
        components:
          type: array
          description: Array of components
          items:
            $ref: '#/components/schemas/LayoutComponent'
    LayoutPreview:
      title: LayoutPreview
      type: object
      # @todo Require 'entity_form_fields' in https://drupal.org/i/3495752.
      required:
        - layout
        - model
      additionalProperties: false
      properties:
        layout:
          type: array
          description: Layout regions
          items:
            type: object
            schema:
              $ref: '#/components/schemas/LayoutSlot'
        model:
          $ref: '#/components/schemas/Model'
        entity_form_fields:
          type: object
    AutoSaveEntry:
      title: Auto Save Entry
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/LayoutPreview'
        owner:
          type: object
          title: Owner details
          description: Details of the last user to save the entry
          examples:
            - Logged in user:
                name: 'Garrett Bobby Ferguson, Jr'
                avatar: /sites/default/files/user-pictures/garrett.jpg
                uri: /user/12
                id: 12
          properties:
            name:
              type: string
              title: User's name
            avatar:
              type: string
              format: uri
              nullable: true
              title: URL to user's avatar picture
            uri:
              type: string
              format: uri
              nullable: true
              title: URL to user's profile page
            id:
              type: integer
              title: User ID
        updated:
          type: integer
          title: Updated timestamp
          description: Unix timestamp for auto-save entry last updated time
          examples:
            - 1732763679
        entity_type:
          type: string
          title: Entity Type ID
          examples:
            - node
        langcode:
          type: string
          title: Language code
          nullable: true
          examples:
            - en
        data_hash:
          type: string
          title: Hash of the item's data
          examples:
            - 4711efecf75d2d1a
        entity_id:
          type:
            - string
            - integer
          title: Entity ID
          description: ID of the entity
          examples:
            - 3
        label:
          type: string
          title: Entity label
          description: Label of the entity
          examples:
            - Home page
    AutoSaveCollection:
      type: object
      # @todo Add key validation for the format in {entity_type}:{entity_id}:{langcode} https://drupal.org/i/3471064.
      additionalProperties:
        $ref: '#/components/schemas/AutoSaveEntry'
    PublishAllRequest:
      type: object
      # @todo Add key validation for the format in {entity_type}:{entity_id}:{langcode} https://drupal.org/i/3471064.
      additionalProperties:
        type: object
        title: Entries to publish
        description: >
          The body should be an object with keys that match unpublished
          entries and a data-hash property for each item.
        properties:
          data_hash:
            type: string
            title: Expected hash for this item
    Error:
      type: object
      required:
        - detail
        - source
      properties:
        detail:
          type: string
          title: Error description
          examples:
            - I can't let you do that Dave
        source:
          type: object
          required:
            - pointer
          properties:
            pointer:
              type: string
              title: Pointer/path to source of error
              examples:
                - title.0.value
        code:
          type: integer
          title: Error code
          examples:
            - 1
        meta:
          type: object
          required:
            - entity_type
            - entity_id
            - entity_label
            - autosave_key
          properties:
            entity_type:
              type: string
              examples:
                - node
              title: Entity Type ID
            entity_id:
              type:
                - string
                - integer
              examples:
                - 3
              title: Entity ID
            label:
              type: string
              examples:
                - Spring sale now on
              title: Item label
            autosave_key:
              type: string
              examples:
                - 'node:4:en'
              title: The corresponding key in the pending changes API
          additionalProperties: false
    Model:
      title: model
      type: object
    PatternPreview:
      title: 'Pattern with generated ID and preview metadata (default markup + CSS + JS)'
      description: '@see \Drupal\experience_builder\Controller\ApiConfigControllers::normalizePattern()'
      type: object
      required:
        - layoutModel
        - name
        - id
        - default_markup
        - css
        - js_header
        - js_footer
      additionalProperties: false
      properties:
        layoutModel:
          type: object
          properties:
            layout:
              type: array
              items:
                $ref: '#/components/schemas/LayoutComponent'
              minItems: 1
            model:
              $ref: '#/components/schemas/Model'
          additionalProperties: false
        name:
          type: string
          description: Human-readable Pattern/Section label
        id:
          type: string
          description: The ID that was auto-generated from the given name.
        default_markup:
          type: string
        css:
          type: string
        js_header:
          type: string
        js_footer:
          type: string
    Pattern:
      title: Pattern
      description: '@see \Drupal\experience_builder\Controller\ApiConfigControllers::denormalizePattern()'
      type: object
      required:
        - name
        - layout
        - model
      properties:
        name:
          type: string
          description: Human-readable Pattern/Section label
        layout:
          type: array
          items:
            $ref: '#/components/schemas/LayoutComponent'
          minItems: 1
        model:
          $ref: '#/components/schemas/Model'
      additionalProperties: false
  # @see https://spec.openapis.org/oas/v3.1.0.html#response-object
  responses:
    FormResponse:
      description: The form
      content:
        application/json:
          examples:
            arbitraryForm:
              value:
                html: <form></form>
          schema:
            type: object
            required:
              - html
            properties:
              html:
                type: string
  # @see https://spec.openapis.org/oas/v3.1.0.html#parameter-object
  parameters:
    entityTypeId:
      name: entityTypeId
      in: path
      required: true
      description: The entity type ID
      schema:
        type: string
      example: node
    entityId:
      name: entityId
      in: path
      required: true
      description: The entity ID
      schema:
        type: integer
      examples:
        arbitraryEntityId:
          value: 42
