# @see https://spec.openapis.org/oas/v3.1.0.html#components-object
components:
  # @see https://spec.openapis.org/oas/v3.1.0.html#schema-object
  schemas:
    # Update ensure required and optional properties are present in
    #    https://drupal.org/i/3507427.
    Component:
      title: Component
      type: object
      required:
        - name
        - id
        - category
        - default_markup
        - library
      properties:
        name:
          type: string
          description: The component name
        id:
          type: string
          description: The component id
        category:
          type: string
          description: The component category
        library:
          type: string
          description: Library ID
          enum:
            # Provided by Experience Builder
            - elements
            # Provided by Modules
            - extension_components
            # Blocks
            - dynamic_components
            # SDCs from the Active Theme + JavaScript Code Components
            - primary_components
        transforms:
          type: object
          description: Transform configuration
        # @see \Drupal\Core\Theme\Component\ComponentMetadata
        metadata:
          type: object
          description: SDC metadata
        field_data:
          type: object
          description: the StaticPropSources to use for each SDC prop
          # Keys are props for this SDC. Only required SDC props are required here.
          additionalProperties:
            type: object
            required:
              - sourceType
              - expression
              - required
            properties:
              sourceType:
                type: string
              expression:
                type: string
              required:
                type: boolean
              default_values:
                type:
                  - string
                  - integer
                  - number
                  - boolean
                  - object
        default_markup:
          type: string
          description: "without providing user input, this is what Component's markup would look like — used to preview the Component prior to placing it"
        dynamic_prop_source_candidates:
          type: object
          description: the DynamicPropSources that match each
    CodeComponent:
      title: Code Component
      type: object
      required:
        - name
        - machineName
        - status
      properties:
        machineName:
          type: string
          description: Machine name
        name:
          type: string
          description: Human-readable code component label
        required:
          type: array
          items:
            type: string
        props:
          type: object
          # @todo Uncomment this in a follow-up MR in https://www.drupal.org/i/3503377
          # $ref: 'https://json-schema.org/draft-04/schema'
        slots:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                label: Title
              description:
                type: string
                label: Description
              examples:
                type: array
                items:
                  type: string
        status:
          type: boolean
        source_code_js:
          type: string
        source_code_css:
          type: string
        compiled_js:
          type: string
        compiled_css:
          type: string
    LayoutComponent:
      title: LayoutComponent
      type: object
      required:
        - nodeType
        - uuid
        - type
        - slots
      additionalProperties: false
      properties:
        nodeType:
          type: string
          enum:
            - component
          description: The layout node type
        uuid:
          type: string
          description: The UUID of the component instance
        type:
          type: string
          # @todo Replace the hardcoded list of allowed component types (ComponentSource plugins) with `[a-z_]+` when contrib/custom component sources are supported.
          pattern: "^(sdc|js|block)+\\.[^:]+$"
        name:
          type: string
          description: The name of the component instance
        slots:
          type: array
          description: Array of slots
          items:
            $ref: '#/components/schemas/LayoutSlot'
    LayoutSlot:
      title: LayoutSlot
      type: object
      required:
        - nodeType
        - name
        - components
      additionalProperties: false
      properties:
        nodeType:
          type: string
          enum:
            - region
            - slot
          description: The layout node type
        id:
          type: string
          description: A unique identifier for the slot
        name:
          type: string
          description: The name of the slot
        components:
          type: array
          description: Array of components
          items:
            $ref: '#/components/schemas/LayoutComponent'
    LayoutPreview:
      title: LayoutPreview
      type: object
      # @todo Require 'entity_form_fields' in https://drupal.org/i/3495752.
      required:
        - layout
        - model
      additionalProperties: false
      properties:
        layout:
          type: array
          description: Layout regions
          items:
            type: object
            schema:
              $ref: '#/components/schemas/LayoutSlot'
        model:
          $ref: '#/components/schemas/Model'
        entity_form_fields:
          type: object
        isNew:
          type: boolean
        isPublished:
          type: boolean
    AutoSaveEntry:
      title: Auto Save Entry
      type: object
      additionalProperties: false
      required:
        - owner
        - updated
        - langcode
        - label
        - entity_type
        - entity_id
        - data_hash
      properties:
        owner:
          type: object
          title: Owner details
          description: Details of the last user to save the entry
          additionalProperties: false
          required:
            - name
            - avatar
            - uri
            - id
          examples:
            - Logged in user:
                name: 'Garrett Bobby Ferguson, Jr'
                avatar: /sites/default/files/user-pictures/garrett.jpg
                uri: /user/12
                id: 12
          properties:
            name:
              type: string
              title: User's name
            avatar:
              type: string
              format: uri
              nullable: true
              title: URL to user's avatar picture
            uri:
              type: string
              format: uri
              nullable: true
              title: URL to user's profile page
            id:
              type: integer
              title: User ID
        updated:
          type: integer
          title: Updated timestamp
          description: Unix timestamp for auto-save entry last updated time
          examples:
            - 1732763679
        entity_type:
          type: string
          title: Entity Type ID
          examples:
            - node
        langcode:
          type: string
          title: Language code
          nullable: true
          examples:
            - en
        data_hash:
          type: string
          title: Hash of the item's data
          examples:
            - 4711efecf75d2d1a
        entity_id:
          type:
            - string
            - integer
          title: Entity ID
          description: ID of the entity
          examples:
            - 3
        label:
          type: string
          title: Entity label
          description: Label of the entity
          examples:
            - Home page
    AutoSaveCollection:
      type: object
      # @todo Add key validation for the format in {entity_type}:{entity_id}:{langcode} https://drupal.org/i/3506543.
      additionalProperties:
        $ref: '#/components/schemas/AutoSaveEntry'
    PublishAllRequest:
      type: object
      # @todo Add key validation for the format in {entity_type}:{entity_id}:{langcode} https://drupal.org/i/3506543.
      additionalProperties:
        type: object
        title: Entries to publish
        description: >
          The body should be an object with keys that match unpublished
          entries and a data-hash property for each item.
        properties:
          data_hash:
            type: string
            title: Expected hash for this item
    AssetLibrary:
      title: Asset Library
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
          description: Asset library ID
        label:
          type: string
          description: Human-readable label
        css:
          type: object
          description: CSS
          nullable: true
          required:
            - original
            - compiled
          additionalProperties: false
          properties:
            original:
              type: string
              description: Original CSS as entered by the human author
            compiled:
              type: string
              description: Compiled CSS code, compiled from the original
        js:
          type: object
          description: JS
          nullable: true
          properties:
            original:
              type: string
              description: Original JS as entered by the human author
            compiled:
              type: string
              description: Compiled JS code, compiled from the original
    Error:
      type: object
      required:
        - detail
        - source
      properties:
        detail:
          type: string
          title: Error description
          examples:
            - I can't let you do that Dave
        source:
          type: object
          required:
            - pointer
          properties:
            pointer:
              type: string
              title: Pointer/path to source of error
              examples:
                - title.0.value
        code:
          type: integer
          title: Error code
          examples:
            - 1
        meta:
          type: object
          required:
            - entity_type
            - entity_id
            - entity_label
            - autosave_key
          properties:
            entity_type:
              type: string
              examples:
                - node
              title: Entity Type ID
            entity_id:
              type:
                - string
                - integer
              examples:
                - 3
              title: Entity ID
            label:
              type: string
              examples:
                - Spring sale now on
              title: Item label
            autosave_key:
              type: string
              examples:
                - 'node:4:en'
              title: The corresponding key in the pending changes API
          additionalProperties: false
    Model:
      title: model
      type: object
    PatternPreview:
      title: 'Pattern with generated ID and preview metadata (default markup + CSS + JS)'
      description: '@see \Drupal\experience_builder\Controller\ApiConfigControllers::normalizePattern()'
      type: object
      required:
        - layoutModel
        - name
        - id
        - default_markup
        - css
        - js_header
        - js_footer
      additionalProperties: false
      properties:
        layoutModel:
          type: object
          properties:
            layout:
              type: array
              items:
                $ref: '#/components/schemas/LayoutComponent'
              minItems: 1
            model:
              $ref: '#/components/schemas/Model'
          additionalProperties: false
        name:
          type: string
          description: Human-readable Pattern/Section label
        id:
          type: string
          description: The ID (possibly auto-generated from the given name).
        default_markup:
          type: string
        css:
          type: string
        js_header:
          type: string
        js_footer:
          type: string
    Pattern:
      title: Pattern
      description: '@see \Drupal\experience_builder\Controller\ApiConfigControllers::denormalizePattern()'
      type: object
      required:
        - name
        - layout
        - model
      properties:
        name:
          type: string
          description: Human-readable Pattern/Section label
        layout:
          type: array
          items:
            $ref: '#/components/schemas/LayoutComponent'
          minItems: 1
        model:
          $ref: '#/components/schemas/Model'
      additionalProperties: false
  # @see https://spec.openapis.org/oas/v3.1.0.html#response-object
  responses:
    FormResponse:
      description: The form
      content:
        application/json:
          examples:
            arbitraryForm:
              value:
                html: <form></form>
          schema:
            type: object
            required:
              - html
            properties:
              html:
                type: string
    ClientErrorResponse:
      description: Errors in response to the client's request.
      content:
        application/json:
          schema:
            type: object
            required:
              - errors
            properties:
              errors:
                type: array
                description: Error items
                items:
                  type: object
                  schema:
                    $ref: '#/components/schemas/Error'
  # @see https://spec.openapis.org/oas/v3.1.0.html#parameter-object
  parameters:
    entityTypeId:
      name: entityTypeId
      in: path
      required: true
      description: The entity type ID
      schema:
        type: string
      example: node
    entityId:
      name: entityId
      in: path
      required: true
      description: The entity ID
      schema:
        type: integer
      examples:
        arbitraryEntityId:
          value: 42
    configEntityId:
      name: configEntityId
      in: path
      required: true
      description: Config entity ID
      schema:
        type: string
      examples:
        arbitraryEntityId:
          value: hopefully_meaningful_name
  # @see https://spec.openapis.org/oas/v3.1.0.html#header-object
  requestBodies:
    Layout:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LayoutPreview'
    PatchLayout:
      content:
        application/json:
          examples:
            componentWithPropSources:
              value:
                componentInstanceUuid: bce8d97e-8d44-4609-adc3-5e1015342b49
                componentType: 'sdc_test:my-cta'
                model:
                  resolved:
                    text: 'hello, world!'
                    href: 'https://drupal.org'
                  source:
                    text:
                      sourceType: static:field_item:string,
                      expression: 'ℹ︎string␟value'
                    href:
                      sourceType: static:field_item:uri,
                      expression: 'ℹ︎uri␟value'
          schema:
            title: Patch layout
            type: object
            required:
              - componentInstanceUuid
              - componentType
              - model
            additionalProperties: false
            properties:
              model:
                title: Model
                description: New model values (client-side terminology) aka inputs (server-side terminology) for the updated component instance
                type: object
                required:
                  - resolved
                additionalProperties: false
                properties:
                  resolved:
                    type: object
                    title: Resolved model/input values, keyed by input names
                  source:
                    type: object
                    title: Optional source values in the case of a component type that uses prop sources.
              componentInstanceUuid:
                type: string
                description: The UUID of the component instance to update
              componentType:
                type: string
                description: The component type (Component config entity ID) of the updated component instance
