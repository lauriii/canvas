openapi: 3.1.0
info:
  title: Experience Builder
  description: API Spec for Experience Builder
  version: 0.x

paths:
  '/api/layout/{entityTypeId}/{entityId}':
    get:
      parameters:
        - $ref: '#/components/parameters/entityTypeId'
        - $ref: '#/components/parameters/entityId'
      responses:
        '200':
          description: The layout
          content:
            application/json:
              examples:
                emptyComponentTree:
                  value:
                    layout:
                      nodeType: region
                      name: content
                      components: []
                    model: {}
                componentTreeWithSingleComponent:
                  value:
                    layout:
                      nodeType: region
                      name: content
                      components:
                        - nodeType: component
                          uuid: bce8d97e-8d44-4609-adc3-5e1015342b49
                          type: 'sdc_test:my-cta'
                    model:
                      bce8d97e-8d44-4609-adc3-5e1015342b49:
                        text: 'hello, world!'
                        href: 'https://drupal.org'
                        name: My Test CTA Component
              schema:
                type: object
                required:
                  - layout
                  - model
                properties:
                  layout:
                    $ref: '#/components/schemas/LayoutSlot'
                  model:
                    $ref: '#/components/schemas/Model'
  '/api/preview/{entityTypeId}/{entityId}':
    post:
      parameters:
        - $ref: '#/components/parameters/entityTypeId'
        - $ref: '#/components/parameters/entityId'
      requestBody:
        $ref: '#/components/requestBodies/Layout'
      responses:
        '200':
          description: Generated preview successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - html
                properties:
                  html:
                    type: string
                    description: The HTML preview.
  '/xb/api/content-update/{entityTypeId}/{entityId}':
    patch:
      parameters:
        - $ref: '#/components/parameters/entityTypeId'
        - $ref: '#/components/parameters/entityId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Saved entity successfully
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    description: Error descriptions
                    items:
                      type: string
  /xb-components:
    get:
      responses:
        '200':
          description: All available components
          content:
            application/json:
              examples:
                singleAvailableComponent:
                  value:
                    'sdc_test:my-cta':
                      id: 'sdc_test:my-cta'
                      name: Call to Action
                      source: Module component
                      category: Buttons
                      metadata:
                        path: >-
                          core/modules/system/tests/modules/sdc_test/components/my-cta
                        documentation: >-
                          No documentation found. Add a README.md in your
                          component directory.
                        status: stable
                        machineName: my-cta
                        name: Call to Action
                        group: All Components
                        schema:
                          type: object
                          required:
                            - text
                          properties:
                            text:
                              type:
                                - string
                                - object
                              title: Title
                              description: The title for the cta
                              examples:
                                - Press
                                - Submit now
                            href:
                              type:
                                - string
                                - object
                              title: URL
                              format: uri
                            target:
                              type:
                                - string
                                - object
                              title: Target
                              enum:
                                - ''
                                - _blank
                            attributes:
                              type:
                                - Drupal\Core\Template\Attribute
                                - object
                              name: Attributes
                          additionalProperties: false
                      description: Call to action link.
                      mandatorySchemas: true
                      slots: []
              schema:
                type: object
                minProperties: 1
                # @see \Drupal\Core\Plugin\Component::$machineName
                patternProperties:
                  '^\\[a-zA-Z0-9_-]:[a-zA-Z0-9_-]$':
                    $ref: '#/components/schemas/Component'
  '/xb-field-form/{entityTypeId}/{entityId}':
    parameters:
      - $ref: '#/components/parameters/entityTypeId'
      - $ref: '#/components/parameters/entityId'
    get:
      responses:
        '200':
          description: Component props form
          content:
            application/json:
              schema:
                type: object
                required:
                  - html
                  - css
                  - js
                  - settings
                properties:
                  html:
                    type: string
                    description: HTML originating from a Drupal render array.
                  css:
                    type: array
                    description: >-
                      Stringified CSS info structured for use by `add_css` AJAX
                      command
                  js:
                    type: object
                    description: >-
                      Stringified JS info structured for use by `add_js` AJAX
                      command
                  settings:
                    type: object
                    description: >-
                      Stringified settings info structured for use by `settings`
                      AJAX command
    post:
      parameters:
        # @see \Drupal\Core\Form\FormBuilderInterface::AJAX_FORM_REQUEST
        # @see \Drupal\Core\Form\EventSubscriber\FormAjaxSubscriber
        # @see \Drupal\Core\EventSubscriber\AjaxResponseSubscriber
        - in: query
          name: ajax_form
          required: true
          schema:
            type: integer
            enum:
              - 1
        # @see \Drupal\experience_builder\Render\MainContent\XBTemplateRenderer
        - in: query
          name: _wrapper_format
          required: true
          schema:
            type: string
            enum:
              - xb_template
              - drupal_ajax
      responses:
        '200':
          description: AJAX updates
          content:
            application/json:
              schema:
                type: object
                description: A Drupal AJAX response.
  '/xb/api/entity-form/{entityTypeId}/{entityId}/{entityFormMode}':
    description: Fetches the entity form with the specified form mode
    get:
      parameters:
        - $ref: '#/components/parameters/entityTypeId'
        - $ref: '#/components/parameters/entityId'
        - name: entityFormMode
          in: path
          required: true
          description: The entity form mode of the form to retrieve
          schema:
            type: string
          example: default
      responses:
        '200':
          $ref: '#/components/responses/FormResponse'
  '/xb/api/entity-form/{entityTypeId}/{entityId}':
    description: Fetches the entity form with the "default" form mode
    get:
      parameters:
        - $ref: '#/components/parameters/entityTypeId'
        - $ref: '#/components/parameters/entityId'
      responses:
        '200':
          $ref: '#/components/responses/FormResponse'
  /xb/api/log-error:
    post:
      requestBody:
        description: Log an error message with a specified log level.
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - level
              properties:
                message:
                  type: string
                  description: The error message to log.
                level:
                  type: string
                  description: The severity level of the log.
                  enum:
                    - emergency
                    - alert
                    - critical
                    - error
                    - warning
                    - notice
                    - info
                    - debug
      responses:
        '200':
          description: Error logged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Error logged successfully
                    description: The success message returned after logging the error.
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error description
  /xb/api/publish-all:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishAllRequest'
      responses:
        '200':
          description: Successful publish
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    title: Success message
                    example: Successfully published 3 items
        '204':
          description: No items to publish
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    title: Status message
                    example: No items to publish
        '422':
          description: Validation errors exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    description: Error items
                    items:
                      type: object
                      schema:
                        $ref: '#/components/schemas/Error'
  /xb/api/autosave:
    get:
      responses:
        '200':
          description: All current auto-save entries
          content:
            application/json:
              examples:
                multipleEntries:
                  value:
                    'node:1:en':
                      data:
                        layout:
                          uuid: root
                          nodeType: root
                          name: root
                          children:
                            - uuid: bce8d97e-8d44-4609-adc3-5e1015342b49
                              nodeType: component
                              type: 'sdc_test:my-cta'
                        model:
                          bce8d97e-8d44-4609-adc3-5e1015342b49:
                            text: 'hello, world!'
                            href: 'https://drupal.org'
                            name: My Test CTA Component
                      langcode: en
                      entity_type: node
                      entity_id: 1
                      label: Home page
                      owner: 1
                    'node:2:en':
                      data:
                        layout:
                          uuid: root
                          nodeType: root
                          name: root
                          children:
                            - uuid: 694446dd-fc32-4f6c-a2b3-e6fa8521cbeb
                              nodeType: component
                              type: 'sdc_test:my-cta'
                        model:
                          694446dd-fc32-4f6c-a2b3-e6fa8521cbeb:
                            text: Read more
                            href: 'https://example.org'
                            name: Read more link
                      langcode: en
                      entity_type: node
                      entity_id: 1
                      label: Home page
                      owner: 1
              schema:
                $ref: '#/components/schemas/AutoSaveCollection'

components:
  schemas:
    Component:
      title: Component
      type: object
      required:
        - name
        - id
        - category
        - metadata
        - field_data
        - default_markup
      properties:
        name:
          type: string
          description: The component name
        id:
          type: string
          description: The component id
        category:
          type: string
          description: The component category
        # @see \Drupal\Core\Theme\Component\ComponentMetadata
        metadata:
          type: object
        field_data:
          type: object
          # Keys are props for this SDC. Only required SDC props are required here.
          additionalProperties:
            type: object
            required:
              - sourceType
              - expression
              - required
            properties:
              sourceType:
                type: string
              expression:
                type: string
              required:
                type: boolean
              default_values:
                type:
                  - string
                  - integer
                  - number
                  - boolean
                  - object
        default_markup:
          type: string
        dynamic_prop_source_candidates:
          type: object
      additionalProperties: false
    LayoutComponent:
      title: LayoutComponent
      type: object
      required:
        - nodeType
        - uuid
        - type
        - slots
      additionalProperties: false
      properties:
        nodeType:
          type: string
          enum: [component]
          description: The layout node type
        uuid:
          type: string
          description: The UUID of the component instance
        type:
          type: string
        name:
          type: string
          description: The name of the component instance
        slots:
          type: array
          description: Array of slots
          items:
            $ref: '#/components/schemas/LayoutSlot'
    LayoutSlot:
      title: LayoutSlot
      type: object
      required:
        - nodeType
        - name
        - components
      additionalProperties: false
      properties:
        nodeType:
          type: string
          enum: [region, slot]
          description: The layout node type
        id:
          type: string
          description: A unique identifier for the slot
        name:
          type: string
          description: The name of the slot
        components:
          type: array
          description: Array of components
          items:
            $ref: '#/components/schemas/LayoutComponent'
    LayoutPreview:
      title: LayoutPreview
      type: object
      additionalProperties: false
      properties:
        layout:
          $ref: '#/components/schemas/LayoutSlot'
        model:
          $ref: '#/components/schemas/Model'
    AutoSaveEntry:
      title: Auto Save Entry
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/LayoutPreview'
        owner:
          type: object
          title: Owner details
          description: Details of the last user to save the entry
          examples:
            Logged in user:
              name: 'Garrett Bobby Ferguson, Jr'
              avatar: /sites/default/files/user-pictures/garrett.jpg
              uri: /user/12
              id: 12
          properties:
            name:
              type: string
              title: User's name
            avatar:
              type: string
              title: URL to user's avatar picture
            uri:
              type: string
              title: URL to user's profile page
            id:
              type: integer
              title: User ID
        updated:
          type: integer
          title: Updated timestamp
          description: Unix timestamp for auto-save entry last updated time
          example: 1732763679
        entity_type:
          type: string
          title: Entity Type ID
          example: node
        langcode:
          type: string
          title: Language code
          example: en
        data_hash:
          type: string
          title: Hash of the item's data
          example: 4711efecf75d2d1a
        entity_id:
          type:
            - string
            - integer
          title: Entity ID
          description: ID of the entity
          example: 3
        label:
          type: string
          title: Entity label
          description: Label of the entity
          example: Home page
    AutoSaveCollection:
      schema:
        type: object
        # @todo Add key validation for the format in {entity_type}:{entity_id}:{langcode} https://drupal.org/i/3471064.
        additionalProperties:
          $ref: '#/components/schemas/AutoSaveEntry'
    PublishAllRequest:
      schema:
        type: object
        # @todo Add key validation for the format in {entity_type}:{entity_id}:{langcode} https://drupal.org/i/3471064.
        additionalProperties:
          type: object
          title: Entries to publish
          description: >
            The body should be an object with keys that match unpublished
            entries and a data-hash property for each item.
          properties:
            data_hash:
              type: string
              title: Expected hash for this item
    Error:
      schema:
        type: object
        required:
          - detail
          - source
        properties:
          detail:
            type: string
            title: Error description
            example: I can't let you do that Dave
          source:
            type: object
            required:
              - pointer
            properties:
              pointer:
                type: string
                title: Pointer/path to source of error
                example: title.0.value
          code:
            type: int
            title: Error code
            example: 1
          meta:
            type: object
            properties:
              entity_type:
                type: string
                example: node
                title: Entity Type ID
              entity_id:
                type:
                  - string
                  - integer
                example: 3
                title: Entity ID
              label:
                type: string
                example: Spring sale now on
                title: Item label
    Model:
      title: model
      type: object
  responses:
    FormResponse:
      description: The form
      content:
        application/json:
          examples:
            arbitraryForm:
              value:
                html: <form></form>
          schema:
            type: object
            required:
              - html
            properties:
              html:
                schema:
                  type: string
  parameters:
    entityTypeId:
      name: entityTypeId
      in: path
      required: true
      description: The entity type ID
      schema:
        type: string
      example: node
    entityId:
      name: entityId
      in: path
      required: true
      description: The entity ID
      schema:
        type: integer
      examples:
        arbitraryEntityId:
          value: 42
  requestBodies:
    Layout:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LayoutPreview'
