services:
  _defaults:
    autowire: true
  Drupal\experience_builder\SdcPropToFieldTypePropMatcher:
    public: true
    arguments:
      $constraintManager: '@validation.constraint'
  Drupal\experience_builder\FieldForComponentSuggester:
    public: true
  Drupal\experience_builder\JsonSchemaDefinitionsStreamwrapper:
    public: true
    tags:
      - { name: stream_wrapper, scheme: json-schema-definitions }
  Drupal\experience_builder\Plugin\AdapterManager:
    parent: default_plugin_manager
  Drupal\experience_builder\FieldTypeUninstallValidator:
    public: true
    tags:
      - { name: module_install.uninstall_validator }
