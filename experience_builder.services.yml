services:
  _defaults:
    autowire: true
  Drupal\experience_builder\SdcPropToFieldTypePropMatcher:
    public: true
    arguments:
      $constraintManager: '@validation.constraint'
  Drupal\experience_builder\FieldForComponentSuggester:
    public: true
  Drupal\experience_builder\JsonSchemaDefinitionsStreamwrapper:
    public: true
    tags:
      - { name: stream_wrapper, scheme: json-schema-definitions }
  Drupal\experience_builder\Plugin\AdapterManager:
    parent: default_plugin_manager
  Drupal\experience_builder\FieldTypeUninstallValidator:
    public: true
    tags:
      - { name: module_install.uninstall_validator }
  Drupal\experience_builder\Plugin\ComponentPluginManager:
    decorates: plugin.manager.sdc
    parent: plugin.manager.sdc
    calls:
      - [setEntityTypeManager, ['@entity_type.manager']]

  logger.channel.experience_builder:
    parent: logger.channel_base
    arguments: ['experience_builder']

  # Event subscribers.
  experience_builder.openapi.http_message_validator.subscriber:
    class: Drupal\experience_builder\EventSubscriber\ApiMessageValidator
    arguments:
      $logger: '@logger.channel.experience_builder'
      $appRoot: '%app.root%'
    calls:
      - [setValidatorBuilder, []]
    tags:
      - { name: event_subscriber }
  experience_builder.theme_negotiator.xb:
    class: Drupal\experience_builder\Theme\XBThemeNegotiator
    tags:
      - { name: theme_negotiator }
