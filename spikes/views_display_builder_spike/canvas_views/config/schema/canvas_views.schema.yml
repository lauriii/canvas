canvas_views.canvas_views_display.*:
  type: config_entity
  label: 'Canvas views display'
  constraints:
    FullyValidatable: ~
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    view_id:
      type: string
      label: 'View'
      constraints:
        NotBlank: ~
    component_tree:
      type: canvas.component_tree
      label: 'The designed display, rendered once per result row'
      constraints:
        # The default requirements, minus list-field: the display renders its
        # tree once per result row and pushes each row's declared field values,
        # so list-field sources resolve here.
        ComponentTreeMeetRequirements:
          inputs:
            absence:
              - entity-field
              - dynamic
              - host-entity-url
              - adapter
            presence: ~
          tree:
            absence: ~
            presence: ~
