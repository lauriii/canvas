<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code editor (spike)</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      #status {
        padding: 6px 12px;
        border-bottom: 1px solid #d0d0d0;
        background: #f5f5f5;
        font-variant-numeric: tabular-nums;
      }
      #panes { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
      #editors { display: grid; grid-template-rows: 1fr 1fr; min-height: 0; }
      #editors > div { overflow: auto; border-right: 1px solid #d0d0d0; }
      #editor-css { border-top: 1px solid #d0d0d0; }
      #preview { border: 0; width: 100%; height: 100%; }
      .cm-editor { height: 100%; }
    </style>
  </head>
  <body>
    <div id="status">Loading…</div>
    <div id="panes">
      <div id="editors">
        <div id="editor-js"></div>
        <div id="editor-css"></div>
      </div>
      <!--
        The nested preview iframe. Its sandbox matches what core's Preview.tsx
        uses; a nested iframe cannot exceed its parent's sandbox, and the parent
        (the extension page iframe) already carries allow-scripts and
        allow-same-origin.
      -->
      <iframe
        id="preview"
        title="Component preview"
        sandbox="allow-scripts allow-same-origin"
      ></iframe>
    </div>
    <script src="dist/index.global.js"></script>
  </body>
</html>
