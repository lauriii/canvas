name: Experience Builder
description: On D10, first install the experimental SDC module! On D11, this is no longer a module.
# REQUIRED READING:
# - https://www.drupal.org/project/sdc
# - https://www.drupal.org/project/sdc_display
# - https://www.drupal.org/project/nomarkup
# - https://www.drupal.org/project/component_library
# - https://www.drupal.org/project/ui_suite
# - https://www.drupal.org/project/ideas/issues/2702061
# SDC schema, component prop types in general:
# - https://stackoverflow.com/questions/34334376/json-schema-for-array-of-tuples
# - https://docs.easyblocks.io/essentials/custom-types
# Transforming from one type to another (field type to SDC prop type — at minimum):
# - https://docs.digibee.com/documentation/components/tools/transformer-jolt/transformer-getting-to-know-jolt
type: module
core_version_requirement: ^10.4 || ^11
php: 8.3
configure: entity.component.collection
dependencies:
  # To support datetime prop shapes.
  # @see https://json-schema.org/understanding-json-schema/reference/string#dates-and-times
  # @see \Drupal\datetime\Plugin\Field\FieldType\DateTimeItem
  # @see \Drupal\experience_builder\JsonSchemaInterpreter\JsonSchemaStringFormat::computeStorablePropShape()
  - drupal:datetime
  # To support the json-schema-definitions://experience_builder.module/image prop shape.
  # @see \Drupal\image\Plugin\Field\FieldType\ImageItem
  # @see \Drupal\experience_builder\JsonSchemaInterpreter\SdcPropJsonSchemaType::computeStorablePropShape()
  - drupal:image
  # … for the same prop shape, but to ensure a better widget experience is available.
  # @see \Drupal\media_library\Plugin\Field\FieldWidget\MediaLibraryWidget
  - drupal:media_library
  # To support prop shapes using `enum`.
  # @see \Drupal\options\Plugin\Field\FieldType\ListFloatItem
  # @see \Drupal\options\Plugin\Field\FieldType\ListIntegerItem
  # @see \Drupal\options\Plugin\Field\FieldType\ListStringItem
  # @see \Drupal\experience_builder\JsonSchemaInterpreter\SdcPropJsonSchemaType::computeStorablePropShape()
  - drupal:options
  # To support URI reference prop shapes.
  # @see https://json-schema.org/understanding-json-schema/reference/string#resource-identifiers
  # @see \Drupal\path\Plugin\Field\FieldType\PathItem
  # @see \Drupal\experience_builder\JsonSchemaInterpreter\JsonSchemaStringFormat::computeStorablePropShape()
  - drupal:path
test_dependencies:
  # For the `cl_editorial:component-card` SDC that we're using in tests.
  - drupal:cl_editorial
  # For the 5 other components we're using in tests.
  - drupal:sdc_test
  # For the additional examples, which use `type: number` etc.
  - drupal:sdc_examples
