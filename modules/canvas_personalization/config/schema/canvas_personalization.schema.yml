canvas_personalization.segment.*:
  type: config_entity
  constraints:
    FullyValidatable: ~
  label: Personalization Segment
  mapping:
    id:
      type: machine_name
      label: ID
    label:
      type: required_label
      label: Label
    description:
      requiredKey: false
      type: text
      label: Description
      nullable: true
    rules:
      # @todo: We should validate the keys are valid filtered plugins. Fix in https://www.drupal.org/i/3527409
      type: sequence
      label: Segment Rules
      orderby: key
      sequence:
        type: condition.plugin.[%key]
        label: Condition Settings
    weight:
      type: weight
      label: Weight

canvas.component_source_local_id.p13n:
  type: canvas.component_source_local_id.*
  label: 'Component ID'
  constraints:
    FullyValidatable: ~
    Choice:
      - switch
      - case
canvas.component_source_settings.p13n:
  type: canvas.component_source_settings.*
  label: 'Personalization component settings'
  constraints:
    FullyValidatable: ~

canvas_personalization.settings:
  type: config_object
  label: 'Drupal Canvas Personalization settings'
  constraints:
    FullyValidatable: ~
  mapping:
    country_header:
      type: string
      label: 'Request header carrying the visitor country code'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[A-Za-z0-9\-]+$/'
    region_header:
      type: string
      label: 'Request header carrying the visitor region code'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[A-Za-z0-9\-]+$/'

# Base settings shared by every segment condition plugin.
# @see \Drupal\canvas_personalization\SegmentCondition\SegmentConditionBase
canvas_personalization.segment_condition_settings:
  type: mapping
  label: 'Segment condition settings'
  mapping:
    id:
      type: string
      label: 'Segment condition plugin ID'
      constraints:
        NotBlank: ~
    negate:
      type: boolean
      label: 'Negate the condition result'

canvas_personalization.segment_condition.query_parameter:
  type: canvas_personalization.segment_condition_settings
  label: 'Query parameter condition'
  constraints:
    FullyValidatable: ~
  mapping:
    parameter:
      type: string
      label: 'URL query parameter'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[a-zA-Z0-9_\+%\-\[\]]+$/'
    value:
      type: string
      label: 'Expected query parameter value'
    matching:
      type: string
      label: 'Matching strategy'
      constraints:
        Choice:
          choices:
            - exact
            - starts_with
            - present

canvas_personalization.segment_condition.utm_parameters:
  type: canvas_personalization.segment_condition_settings
  label: 'UTM parameters condition'
  constraints:
    FullyValidatable: ~
  mapping:
    all:
      # This allows us to implement ALL or ANY, which translates to AND/OR.
      type: boolean
      label: 'All parameters must match'
    parameters:
      type: sequence
      label: 'Parameters'
      sequence:
        type: mapping
        mapping:
          key:
            type: string
            constraints:
              NotBlank: ~
              Regex:
                pattern: '/^[a-zA-Z0-9_\+%\-]+$/'
          value:
            type: string
            constraints:
              NotBlank: ~
              Regex:
                pattern: '/^[a-zA-Z0-9_\+%\-]+$/'
          matching:
            type: string
            constraints:
              Choice:
                choices:
                  - exact
                  - starts_with

canvas_personalization.segment_condition.geolocation:
  type: canvas_personalization.segment_condition_settings
  label: 'Geolocation condition'
  constraints:
    FullyValidatable: ~
  mapping:
    countries:
      type: sequence
      label: 'Country codes'
      orderby: value
      constraints:
        NotBlank: ~
      sequence:
        type: string
        label: 'ISO 3166-1 alpha-2 country code'
        constraints:
          Regex:
            pattern: '/^[A-Z]{2}$/'
    regions:
      type: sequence
      label: 'Region codes'
      orderby: value
      sequence:
        type: string
        label: 'Region code'
        constraints:
          Regex:
            pattern: '/^[A-Z0-9]{1,3}$/'

canvas_personalization.segment_condition.day_of_week:
  type: canvas_personalization.segment_condition_settings
  label: 'Day of week condition'
  constraints:
    FullyValidatable: ~
  mapping:
    days:
      type: sequence
      label: 'Days of week'
      orderby: value
      constraints:
        NotBlank: ~
      sequence:
        type: string
        label: 'Day'
        constraints:
          Choice:
            choices:
              - monday
              - tuesday
              - wednesday
              - thursday
              - friday
              - saturday
              - sunday

condition.plugin.utm_parameters:
  # @todo For being FullyValidatable, we need https://www.drupal.org/i/3525391 to be
  # fixed. In the meantime, see
  # \Drupal\canvas_personalization\Hook\SegmentationRulesHooks::configSchemaInfoAlter
  type: condition.plugin
  label: 'UTM Parameters condition'
  constraints:
    FullyValidatable: ~
  mapping:
    all:
      # This allows us to implement ALL or ANY, which translates to AND/OR.
      type: boolean
      label: All parameters must match
    parameters:
      type: sequence
      label: Parameters
      orderby: key
      sequence:
        type: mapping
        mapping:
          key:
            type: string
            constraints:
              NotBlank: ~
              # todo: Verify this regex is the right one in https://www.drupal.org/i/3527075
              Regex:
                pattern: '/^[a-zA-Z0-9_\+%\-]+$/'
          value:
            type: string
            constraints:
              NotBlank: ~
              # todo: Verify this regex is the right one in https://www.drupal.org/i/3527075
              Regex:
                pattern: '/^[a-zA-Z0-9_\+%\-]+$/'
          matching:
            type: string
            constraints:
              Choice:
                choices:
                  - exact
                  - starts_with
