        sdc.canvas_test_sdc.crash:
          name: "Canvas test SDC that crashes when 'crash' prop is TRUE"
          description: "Canvas test SDC that crashes when 'crash' prop is TRUE"
        sdc.canvas_test_sdc.date:
          name: Date
          description: Date
        sdc.canvas_test_sdc.deprecated:
          name: 'Deprecated SDC'
          description: 'A deprecated SDC component.'
        sdc.canvas_test_sdc.document:
          name: Document
