# The catalog in the first message lists every component the test site
# generates: the canvas_test_sdc SDCs plus the core block plugins. echoai
# matches this request byte-for-byte, so adding, renaming or removing one of
# those components fails the match until this catalog is updated too.
# Hop 1 of a metadata turn: the agent parks a set_page_value call for the title and one for the description.
request:
  messages:
    -
      role: user
      text: |+
        The following is information that is important as context: 
        -----------------------------------------------
        Tool processed: get_component_context
        Values: Available components
        Description of values: The following is the catalog of components available on this site, each with its id, name, and description only. Scan it to shortlist candidates, then call get_component_details with their ids to get their props and slots before placing. Never use a component that is not listed here:
        Results: 
        block.system_branding_block:
          name: 'Site branding'
          description: 'Site branding'
        block.system_breadcrumb_block:
          name: Breadcrumbs
          description: Breadcrumbs
        block.system_menu_block.footer:
