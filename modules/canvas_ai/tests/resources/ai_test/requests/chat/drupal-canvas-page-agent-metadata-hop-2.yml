# The component catalog the agent's default information tool fetches is not
# among the messages: it feeds the system prompt, which echoai does not match.
# Hop 2 of a metadata turn: both results are in the history and the agent closes the turn.
request:
  messages:
    -
      role: user
      text: |-
        <context>
        The user is currently working on a canvas_page entity. User has not selected any particular component from the page. Page title is empty. Page description is empty.
        </context>

        <user_message>
        Set the page title to Campus and the description to Visit us
        </user_message>
      images: {  }
      remote_files: {  }
      tools: null
      tool_id: null
    -
      role: assistant
      text: 'Setting the page title and description now.'
      images: {  }
      remote_files: {  }
      tools:
        -
          id: call_1
          type: function
          function:
            name: set_page_value
            arguments: '{"key":"title","value":"Campus"}'
        -
          id: call_2
          type: function
          function:
            name: set_page_value
            arguments: '{"key":"description","value":"Visit us"}'
      tool_id: null
    -
      role: tool
      text: 'Page title set successfully.'
      images: {  }
      remote_files: {  }
      tools: null
      tool_id: call_1
    -
      role: tool
      text: 'Page description set successfully.'
      images: {  }
      remote_files: {  }
      tools: null
      tool_id: call_2
  debug_data: {  }
  chat_tools:
    -
      type: function
      function:
        name: place_components
        description: 'Places a section of components onto the current page. Call this once per section/row. Each placement operation targets a region or slot and carries the components to place there. Components are not added to the page unless this tool is called. It may return validation errors if a target, placement, or component is invalid.'
        parameters:
          type: object
          properties:
            operations:
              name: operations
              type: array
              description: 'Placement operations The placements to apply, one entry per target position.'
              minItems: 1
              items:
                type: object
                properties:
                  target:
                    name: target
                    type: string
                    description: "Target The region name, such as 'content', or 'parent-uuid/slot_name' to place inside a component's slot."
                  placement:
                    name: placement
                    type: string
                    description: "Placement Whether to place the components 'inside' a target that has no children yet, or 'above'/'below' the component named by reference_uuid."
                    enum:
                      - above
                      - below
                      - inside
                  reference_uuid:
                    name: reference_uuid
                    type: string
                    description: "Reference UUID The UUID of the component to place above or below. Required for 'above' and 'below'; omit it for 'inside'."
                  components:
                    name: components
                    type: string
                    description: "Components The components to place, as a YAML list starting at the top level. Each entry is a single-key map of the component ID to its 'props' and, when the component has slots, its 'slots'."
                required:
                  - target
                  - placement
                  - components
          required:
            - operations
    -
      type: function
      function:
        name: edit_components
        description: "Updates the props of one or more components already on the page. Provide a list of edits; each edit targets one component by its 'component_uuid' and carries a 'props' YAML block of 'prop_name: value' pairs to set on it. Include only the props being changed. May return validation errors if a UUID is not on the page or a prop value is invalid."
        parameters:
          type: object
          properties:
            component_edits:
              name: component_edits
              type: array
              description: 'Component edits A list of component edits, one entry per component to update.'
              minItems: 1
              items:
                type: object
                properties:
                  component_uuid:
                    name: component_uuid
                    type: string
                    description: 'Component UUID The UUID of a component already present on the page.'
                  props:
                    name: props
                    type: string
                    description: "Prop changes A YAML block of 'prop_name: value' pairs to set on this component. Include only the props being changed; nested values (e.g. an image object) are allowed."
                required:
                  - component_uuid
                  - props
          required:
            - component_edits
    -
      type: function
      function:
        name: get_component_details
        description: 'Returns the description, props, and slots of specific components identified by id. Use this to get the full metadata of components you have already shortlisted — e.g. after browsing the catalog with get_component_context — so you have the exact props and slots needed to place or configure them.'
        parameters:
          type: object
          properties:
            component_ids_list:
              name: component_ids_list
              type: array
              description: 'Component IDs The ids of the components to fetch details for, e.g. sdc.canvas_test_sdc.my-hero.'
              minItems: 1
              items:
                name: component_ids_list
                type: string
                description: 'Component IDs The ids of the components to fetch details for, e.g. sdc.canvas_test_sdc.my-hero.'
    -
      type: function
      function:
        name: set_page_value
        description: 'Sets the title or SEO meta description of the current page. Set "key" to "title" or "description", and "value" to the text to write. Use this whenever the page title or meta description should be created or changed.'
        parameters:
          type: object
          properties:
            key:
              name: key
              type: string
              description: "Page value key The page value to set. Allowed values: 'title', 'description'."
              enum:
                - title
                - description
            value:
              name: value
              type: string
              description: 'Value The text value to set for the given key.'
          required:
            - key
            - value
  chat_structured_json_schema: {  }
  chat_strict_schema: false
response:
  normalized:
    role: assistant
    text: 'The title and description are set.'
    images: {  }
    remote_files: {  }
    tools: null
    tool_id: null
  rawOutput: null
  metadata: {  }
  tokenUsage:
    input: 0
    output: 0
    total: 0
    reasoning: 0
    cached: 0
  rateLimits:
    rateLimitMaxRequests: null
    rateLimitMaxTokens: null
    rateLimitRemainingRequests: null
    rateLimitRemainingTokens: null
    rateLimitResetRequests: null
    rateLimitResetTokens: null
