canvas_ai.settings:
  type: config_object
  label: 'Drupal Canvas AI Settings'
  mapping:
    http_client_options:
      type: mapping
      label: 'HTTP Client Options'
      mapping:
        timeout:
          type: integer
          label: 'Timeout'
          description: 'HTTP request timeout in seconds'
    file_upload_size:
      type: integer
      label: 'Maximum image upload size (MB)'
      description: 'Maximum allowed image upload size in megabytes.'
    chat_history_max_messages:
      type: integer
      label: 'Maximum chat history messages'
      description: 'Maximum number of previous messages passed to the AI as conversation history. -1 means full history, 0 means no history.'
      constraints:
        Range:
          min: -1
    # The main_agent and tools defaults are set by canvas_ai_install(), because
    # their constraints reference agents this module ships itself.
    # @see canvas_ai_install()
    # @see https://www.drupal.org/project/drupal/issues/3425992
    main_agent:
      type: string
      label: 'Main agent'
      description: 'The ai_agent ID invoked for a chat turn when no Tool is active.'
      constraints:
        NotBlank: []
        ConfigExists:
          prefix: 'ai_agents.ai_agent.'
    tools:
      type: sequence
      label: 'Tools'
      description: 'The ai_agent IDs offered as Tools in the chat.'
      orderby: value
      sequence:
        type: string
        label: 'Agent ID'
        constraints:
          ConfigExists:
            prefix: 'ai_agents.ai_agent.'
    keep_tool_calls_in_history:
      type: boolean
      label: 'Keep tool calls and results in the chat history'
      description: "Whether the agent state a turn ends with, tool calls and results included, is kept for the conversation's next turn."

canvas_ai.component_description.settings:
  type: config_object
  label: 'Canvas AI Component Description Settings'
  mapping:
    component_context:
      type: sequence
      label: 'Component Source'
      orderby: key
      constraints:
        # Canvas AI agents only work with SDC, block, and JS component sources.
        SequenceKeysMatchRegex:
          pattern: '/^(sdc|js|block)$/'
          message: 'The %value key is not a supported component source plugin ID.'
      sequence:
        type: mapping
        label: 'Source config'
        mapping:
          enabled:
            type: boolean
            label: 'Enabled'
          data:
            type: text
            label: 'Data'
            description: 'YAML string containing the component data.'
            constraints:
              NotBlank: []
