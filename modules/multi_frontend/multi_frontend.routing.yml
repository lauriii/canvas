multi_frontend.schema.catalog:
  path: '/component-api/schema'
  defaults:
    _controller: '\Drupal\multi_frontend\Controller\ComponentApiController::schemaCatalog'
  methods: [GET]
  requirements:
    # Component schemas describe code that already ships in the codebase, the
    # way a theme's .component.yml does. They carry no content and no access
    # decision, so they are public, which is what makes them usable by a
    # front-end developer's toolchain without credentials.
    _access: 'TRUE'

multi_frontend.schema.envelope:
  path: '/component-api/schema/_envelope'
  defaults:
    _controller: '\Drupal\multi_frontend\Controller\ComponentApiController::envelopeSchema'
  methods: [GET]
  requirements:
    _access: 'TRUE'

multi_frontend.schema.component:
  path: '/component-api/schema/{producer}'
  defaults:
    _controller: '\Drupal\multi_frontend\Controller\ComponentApiController::componentSchema'
  methods: [GET]
  requirements:
    _access: 'TRUE'

route_callbacks:
  - 'Drupal\multi_frontend\Routing\ComponentApiRoutes::routes'

multi_frontend.form.catalog:
  path: '/form-api'
  defaults:
    _controller: '\Drupal\multi_frontend\Controller\FormApiController::catalog'
  methods: [GET]
  requirements:
    _access: 'TRUE'

multi_frontend.form.describe:
  path: '/form-api/{form}'
  defaults:
    _controller: '\Drupal\multi_frontend\Controller\FormApiController::describe'
  methods: [GET]
  requirements:
    _access: 'TRUE'

multi_frontend.form.submit:
  path: '/form-api/{form}'
  defaults:
    _controller: '\Drupal\multi_frontend\Controller\FormApiController::submit'
  methods: [POST]
  requirements:
    # Core's own decoupled CSRF check, the same one REST uses. The client
    # fetches the token from /session/token, which already exists.
    _csrf_request_header_token: 'TRUE'
