type: module
name: Drupal Canvas Headless
description: 'Connects your headless frontend app to Drupal Canvas so editors can build pages and preview draft content using your app’s components.'
package: Drupal Canvas
core_version_requirement: ^11.3
dependencies:
  - canvas:canvas
  - simple_oauth:simple_oauth (>=6.1.0)
  - consumers:consumers
  - custom_elements:custom_elements
