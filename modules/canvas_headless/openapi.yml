openapi: 3.1.0

info:
  title: Drupal Canvas Headless
  description: API Spec for the Canvas Headless submodule
  version: 0.x

# All routes except the public content endpoint require Drupal session
# authentication. The session cookie name is site-specific, so represent the
# complete Cookie header rather than declaring a fixed cookie name.
security:
  - DrupalSessionCookie: []

# @see https://spec.openapis.org/oas/v3.1.0.html#paths-object
# @see https://spec.openapis.org/oas/v3.1.0.html#path-item-object
paths:
  /canvas/content-api:
    get:
      summary: Resolve and render routed Canvas content
      description: |
        Accepts a site-relative Drupal request URI and returns either rendered
        Canvas content metadata or redirect metadata.
      parameters:
        - name: requestUri
          in: query
          required: true
          description: Site-relative request URI without a fragment.
          schema:
            type: string
            examples:
              - /page/1
              - /node/12?language=fr
        - name: language
          in: query
          required: false
          description: Configured language selected in Canvas's read-only preview. Honored only for preview-scoped tokens; an unknown language returns 404. Missing translations use Drupal's configured fallback.
          schema:
            type: string
        - name: componentId
          in: query
          required: false
          description: Optional external component preview selector.
          schema:
            type: string
        - name: pageVariant
          in: query
          required: false
          description: Optional page variant editor preview selector.
          schema:
            type: string
        - name: excludeAutoSave
          in: query
          required: false
          description: Exclude Canvas auto-saves from preview rendering.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Content result or redirect result.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CanvasContentResult'
                  - $ref: '#/components/schemas/CanvasRedirectResult'
              examples:
                content:
                  summary: French request rendering English because the French translation is unavailable.
                  value:
                    content:
                      element: js-example-card
                      props:
                        heading: Example heading
                    head:
                      title: Example page
                    route:
                      name: entity.canvas_page.canonical
                      requestUri: /fr/page/1
                      params:
                        canvas_page: '1'
                      managedByCanvas: true
                      negotiatedLanguage: fr
                      translations:
                        - langcode: en
                          name: English
                          nativeName: English
                          url: /contact
                          translationAvailable: true
                          current: false
                          external: false
                        - langcode: fr
                          name: French
                          nativeName: Français
                          url: /fr/page/1
                          translationAvailable: false
                          current: true
                          external: false
                        - langcode: es
                          name: Spanish
                          nativeName: Español
                          url: /es/contact
                          translationAvailable: true
                          current: false
                          external: false
                      entity:
                        entityType: canvas_page
                        bundle: canvas_page
                        id: '1'
                        uuid: 773942c6-3660-4c50-9a8d-e25966a69bff
                        langcode: en
                    context:
                      page:
                        pageTitle: Example page
                        breadcrumbs:
                          - key: <front>
                            text: Home
                            url: /
                        mainEntity:
                          bundle: canvas_page
                          entityTypeId: canvas_page
                          uuid: 773942c6-3660-4c50-9a8d-e25966a69bff
                          requestedLanguage: fr
                          renderedLanguage: en
                          translations:
                            - langcode: en
                              name: English
                              nativeName: English
                              url: /contact
                              translationAvailable: true
                              current: false
                            - langcode: fr
                              name: French
                              nativeName: Français
                              url: /fr/page/1
                              translationAvailable: false
                              current: true
                            - langcode: es
                              name: Spanish
                              nativeName: Español
                              url: /es/contact
                              translationAvailable: true
                              current: false
                      site:
                        branding:
                          homeUrl: /page/1
                          siteName: Example site
                          siteSlogan: ''
                        baseUrl: https://example.com
                        langcode: en
                        themeAssets:
                          logo:
                            url: https://example.com/core/themes/olivero/logo.svg
                          favicon:
                            url: https://example.com/core/themes/olivero/favicon.ico
                            mimeType: image/vnd.microsoft.icon
                    cacheTags: [node:12, config:user.role.anonymous, http_response]
                    cacheMaxAge: -1
                redirect:
                  value:
                    redirect:
                      external: false
                      url: /new-path
                      statusCode: 301
                    cacheTags: [redirect_list, http_response]
                    cacheMaxAge: -1
        '302':
          description: >-
            Non-cacheable, same-origin language negotiation transport redirect
            for a preview-scoped request. Follow Location back to this endpoint
            with the same authorization. At most one language redirect is issued;
            unsuccessful negotiation on that hop returns 404.
          headers:
            Location:
              schema:
                type: string
              description: Same-origin content API URL retaining preview context.
        '400':
          $ref: '#/components/responses/ProblemDetailsResponse'
        '401':
          $ref: '#/components/responses/ProblemDetailsResponse'
        '403':
          $ref: '#/components/responses/ProblemDetailsResponse'
        '404':
          $ref: '#/components/responses/ProblemDetailsResponse'
        '500':
          $ref: '#/components/responses/ProblemDetailsResponse'
      security: []

  /canvas/content-api/entity:
    get:
      summary: Render one Canvas-managed content entity
      description: |
        Accepts one content entity target and returns its rendered Canvas
        content when Canvas manages the requested entity and view mode.
      parameters:
        - name: type
          in: query
          required: true
          description: Content entity type ID.
          schema:
            type: string
            examples:
              - node
        - name: id
          in: query
          required: true
          description: Content entity ID.
          schema:
            oneOf:
              - type: string
              - type: integer
        - name: viewMode
          in: query
          required: false
          description: Optional content-template view mode.
          schema:
            type: string
            pattern: '^[a-z0-9_]+$'
        - name: excludeAutoSave
          in: query
          required: false
          description: Exclude Canvas auto-saves from preview rendering.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Entity render result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasEntityResult'
              examples:
                entity:
                  value:
                    content:
                      element: js-example-card
                      props:
                        heading: Example heading
                    managedByCanvas: true
                    entity:
                      entityType: node
                      bundle: article
                      id: '12'
                      uuid: 773942c6-3660-4c50-9a8d-e25966a69bff
                      langcode: en
                    cacheTags: [node:12, http_response]
                    cacheMaxAge: -1
        '400':
          $ref: '#/components/responses/ProblemDetailsResponse'
        '401':
          $ref: '#/components/responses/ProblemDetailsResponse'
        '403':
          $ref: '#/components/responses/ProblemDetailsResponse'
        '404':
          $ref: '#/components/responses/ProblemDetailsResponse'
        '500':
          $ref: '#/components/responses/ProblemDetailsResponse'
      security: []

  /canvas-headless/cache-invalidation:
    post:
      summary: Read announced invalidated cache tags
      description: |
        Returns the cache tags invalidated in one Drupal request, once. Drupal
        announces the ID to every configured frontend that has cache
        invalidation enabled, by sending the same JSON body to
        `/api/canvas/revalidate` below the frontend URL. IDs expire after five
        minutes. A frontend that does not read the tags within 30 seconds is
        told to expire everything later, by the tag `http_response`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        '200':
          description: The invalidated cache tags.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tags]
                properties:
                  tags:
                    $ref: '#/components/schemas/CacheTags'
        '404':
          $ref: '#/components/responses/DrupalErrorResponse'
      security: []

  /canvas-headless/assertion:
    post:
      summary: Mint a preview assertion
      description: |
        Returns a signed assertion token for headless preview activation or
        renewal. The request can identify the preview entry point with either:
        - `path`
        - `entity_type` + `entity`

        Cookie authentication and an X-CSRF-Token request header are required.
      parameters:
        - name: path
          in: query
          required: false
          description: Relative path beginning with '/'.
          schema:
            type: string
            examples:
              - /
              - /node/7
        - name: entity_type
          in: query
          required: false
          description: Entity type ID for activation flow.
          schema:
            type: string
            examples:
              - node
        - name: entity
          in: query
          required: false
          description: Entity ID for activation flow.
          schema:
            oneOf:
              - type: string
              - type: integer
        - name: renewal
          in: query
          required: false
          description: Marks the assertion for in-place renewal flow.
          schema:
            type: boolean
        - name: language
          in: query
          required: false
          description: Configured language selected in Canvas's read-only preview. An unknown language returns 400.
          schema:
            type: string
        - name: view_mode
          in: query
          required: false
          description: Optional content-template preview context view mode.
          schema:
            type: string
            pattern: '^[a-z0-9_]+$'
        - name: exclude_auto_save
          in: query
          required: false
          description: Exclude Canvas auto-saves from this preview request.
          schema:
            oneOf:
              - type: boolean
              - type: integer
                enum: [0, 1]
            default: false
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Preview assertion minted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [assertion]
                properties:
                  assertion:
                    type: string
                    description: Serialized signed JWT assertion.
        '400':
          $ref: '#/components/responses/DrupalErrorResponse'
        '403':
          $ref: '#/components/responses/DrupalErrorResponse'
        '404':
          $ref: '#/components/responses/DrupalErrorResponse'

  /canvas-headless/renew:
    get:
      summary: Renew preview session via redirect
      description: |
        Mints a fresh preview URL for a relative path and redirects the user
        back into the configured headless frontend.
      parameters:
        - name: path
          in: query
          required: true
          description: Relative path beginning with '/'.
          schema:
            type: string
            examples:
              - /node/7
      responses:
        '302':
          description: Redirect to frontend draft URL with fresh assertion.
          headers:
            Location:
              description: Absolute frontend URL.
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/DrupalErrorResponse'
        '403':
          $ref: '#/components/responses/DrupalErrorResponse'

  /canvas/api/v0/headless/frontends:
    get:
      summary: Get configured headless frontends
      responses:
        '200':
          description: Ordered frontend list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendsPayload'
        '403':
          $ref: '#/components/responses/DrupalErrorResponse'
    patch:
      summary: Replace configured headless frontends
      description: |
        Replaces the entire ordered list of configured frontend URLs.
        Cookie authentication and an X-CSRF-Token request header are required.
        A frontend whose `cacheInvalidation` is omitted keeps its value, or
        starts with `false`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrontendsPayload'
      responses:
        '200':
          description: Updated frontend list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendsPayload'
        '400':
          description: Invalid payload shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          $ref: '#/components/responses/DrupalErrorResponse'
        '422':
          description: >-
            Invalid or duplicate frontend URL, or a `cacheInvalidation` that is
            not a boolean.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /canvas/api/v0/headless/frontends/cache-invalidation/test:
    post:
      summary: Test cache invalidation for a headless frontend
      description: |
        Announces to one configured frontend now, whether or not cache
        invalidation is enabled for it, and waits up to five seconds for the
        frontend to read the cache tags from Drupal. The announced tag is one
        that no response carries, so nothing expires, unless `expireAll` is
        true or the frontend missed an earlier announcement: then the tag is
        `http_response`, and the frontend expires everything. A frontend
        whose cache invalidation was just turned on missed what changed while
        it was off, so its first test also announces `http_response`. A
        frontend whose cache invalidation is off keeps no state.
        Cookie authentication and an X-CSRF-Token request header are required.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: The URL of a configured frontend.
                expireAll:
                  type: boolean
                  default: false
                  description: Whether the frontend must expire everything.
      responses:
        '200':
          description: The outcome of the test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheInvalidationTestResult'
              examples:
                read:
                  value:
                    ok: true
                    announced: true
                    read: true
                    message: The frontend received the announcement and read the cache tags.
                notAnnounced:
                  value:
                    ok: false
                    announced: false
                    read: false
                    message: The frontend answered HTTP 404.
        '400':
          description: Invalid payload shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          $ref: '#/components/responses/DrupalErrorResponse'
        '422':
          description: The URL is not a configured frontend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /canvas/api/v0/headless/components/sync/start:
    post:
      summary: Start external component synchronization
      description: |
        Validates the selected frontend and returns a preview assertion plus the
        metadata path the browser should fetch from that frontend.
        Cookie authentication and an X-CSRF-Token request header are required.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncFrontendRequest'
      responses:
        '200':
          description: Sync start accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [assertion, metadataPath]
                properties:
                  assertion:
                    type: string
                  metadataPath:
                    type: string
                    examples: [/api/canvas/components]
        '400':
          $ref: '#/components/responses/DrupalErrorResponse'
        '403':
          description: Access denied or assertion could not be issued.
          content:
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorMessage'
                  - $ref: '#/components/schemas/DrupalErrorMessage'

  /canvas/api/v0/headless/components/sync/complete:
    post:
      summary: Complete external component synchronization
      description: |
        Applies browser-fetched component metadata for the selected frontend.
        Cookie authentication and an X-CSRF-Token request header are required.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCompleteRequest'
      responses:
        '200':
          description: Sync result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/SyncResult'
        '400':
          $ref: '#/components/responses/DrupalErrorResponse'
        '422':
          description: Invalid metadata payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /canvas/api/v0/headless/components/sync/fail:
    post:
      summary: Report frontend metadata fetch failure
      description: |
        Records a synchronization failure reported by the browser.
        Cookie authentication and an X-CSRF-Token request header are required.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncFailRequest'
      responses:
        # 200 is deliberate: the failure being reported is the browser's, and
        # recording it as a notification is the successful outcome of this
        # request. The echoed message describes the reported failure, not an
        # error in this request.
        '200':
          description: Failure acknowledged and recorded as a notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '400':
          $ref: '#/components/responses/DrupalErrorResponse'

components:
  schemas:
    CanvasContentResult:
      type: object
      additionalProperties: false
      required: [content, head, route, context, cacheTags, cacheMaxAge]
      properties:
        content:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        head:
          $ref: '#/components/schemas/UnheadDocument'
        route:
          $ref: '#/components/schemas/CanvasRouteContext'
        context:
          $ref: '#/components/schemas/CanvasContext'
        cacheTags:
          $ref: '#/components/schemas/CacheTags'
        cacheMaxAge:
          $ref: '#/components/schemas/CacheMaxAge'

    CacheTags:
      description: >-
        The response's Drupal cache tags. Frontends tag cached results with
        them, and expire it when Drupal announces the tags invalidated.
      type: array
      items:
        type: string

    CacheMaxAge:
      description: >-
        How many seconds the response may be cached; -1 for no limit. Like
        `cacheTags`, it includes the cache contexts' dependencies.
      type: integer
      minimum: -1

    CanvasContext:
      description: >-
        The page and site context React Code Components read through the
        `usePageContext()` and `useSiteContext()` hooks of the `drupal-canvas`
        package, generated for the routed request.
      type: object
      additionalProperties: false
      required: [page, site]
      properties:
        page:
          type: object
          additionalProperties: false
          required: [pageTitle, breadcrumbs, mainEntity]
          properties:
            pageTitle:
              type: string
            breadcrumbs:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key, text, url]
                properties:
                  key:
                    type: string
                  text:
                    type: string
                  url:
                    type: string
            mainEntity:
              oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required:
                    - bundle
                    - entityTypeId
                    - uuid
                    - requestedLanguage
                    - renderedLanguage
                    - translations
                  properties:
                    bundle:
                      type: string
                    entityTypeId:
                      type: string
                    uuid:
                      type: string
                    requestedLanguage:
                      type: string
                    renderedLanguage:
                      type: string
                    translations:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - langcode
                          - name
                          - nativeName
                          - url
                          - translationAvailable
                          - current
                        properties:
                          langcode:
                            type: string
                          name:
                            type: string
                          nativeName:
                            type: string
                          url:
                            type: string
                          translationAvailable:
                            type: boolean
                          current:
                            type: boolean
        site:
          type: object
          additionalProperties: false
          required: [branding, baseUrl, themeAssets, langcode]
          properties:
            branding:
              type: object
              additionalProperties: false
              required: [homeUrl, siteName, siteSlogan]
              properties:
                homeUrl:
                  type: string
                siteName:
                  type: string
                siteSlogan:
                  type: string
            baseUrl:
              type: string
            langcode:
              type: string
              description: >-
                The langcode of the interface language negotiated for the
                request. `useDateFormatter()` formats dates in this locale.
            themeAssets:
              description: >-
                Assets from Drupal's configured default theme, without request
                theme negotiation. Frontends may choose whether to use them.
                URLs may be empty for unset or disabled assets; favicon MIME
                settings are preserved even when the URL is empty.
              type: object
              additionalProperties: false
              required: [logo, favicon]
              properties:
                logo:
                  type: object
                  additionalProperties: false
                  required: [url]
                  properties:
                    url:
                      type: string
                favicon:
                  type: object
                  additionalProperties: false
                  required: [url, mimeType]
                  properties:
                    url:
                      type: string
                    mimeType:
                      type: string
        translations:
          description: >-
            Interface translations of the strings the rendered code components
            pass to `t()` and `formatPlural()` of `useTranslation()`, in the
            request's interface language. Absent when none of them is
            translated.
          type: object
          additionalProperties: false
          required: [strings]
          properties:
            strings:
              description: >-
                Translated strings keyed by context (empty string when none),
                then by source string. Plural forms are joined with U+0003.
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: string
            pluralFormula:
              description: >-
                The plural form index for counts up to 199, with a `default`.
              type: object
              additionalProperties:
                type: integer

    CanvasRedirectResult:
      type: object
      additionalProperties: false
      required: [redirect, cacheTags, cacheMaxAge]
      properties:
        redirect:
          type: object
          additionalProperties: false
          required: [external, url, statusCode]
          properties:
            external:
              type: boolean
            url:
              type: string
            statusCode:
              type: integer
        cacheTags:
          $ref: '#/components/schemas/CacheTags'
        cacheMaxAge:
          $ref: '#/components/schemas/CacheMaxAge'

    CanvasEntityResult:
      type: object
      additionalProperties: false
      required: [content, managedByCanvas, entity, cacheTags, cacheMaxAge]
      properties:
        content:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        managedByCanvas:
          type: boolean
        entity:
          $ref: '#/components/schemas/RoutedEntityRef'
        cacheTags:
          $ref: '#/components/schemas/CacheTags'
        cacheMaxAge:
          $ref: '#/components/schemas/CacheMaxAge'

    UnheadDocument:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
        meta:
          type: array
          items:
            type: object
            additionalProperties: true
        link:
          type: array
          items:
            type: object
            additionalProperties: true
        script:
          type: array
          items:
            type: object
            additionalProperties: true

    CanvasRouteContext:
      type: object
      additionalProperties: false
      required: [name, requestUri, params, managedByCanvas, entity, negotiatedLanguage, translations]
      properties:
        name:
          type: string
        requestUri:
          type: string
        params:
          type: object
          additionalProperties:
            type: string
        managedByCanvas:
          type: boolean
        entity:
          oneOf:
            - $ref: '#/components/schemas/RoutedEntityRef'
            - type: 'null'
        negotiatedLanguage:
          type: string
          description: Negotiated content-language ID, which may differ from the rendered entity language on fallback.
        translations:
          type: array
          description: All enabled languages, with Code Component translation metadata and fallback URL semantics. Empty on monolingual sites and routes without a canonical content entity.
          items:
            $ref: '#/components/schemas/RouteTranslation'

    RouteTranslation:
      type: object
      additionalProperties: false
      required: [langcode, name, nativeName, translationAvailable, current, url, external]
      properties:
        langcode:
          type: string
        name:
          type: string
          description: Localized language name.
        nativeName:
          type: string
          description: The language's own name.
        translationAvailable:
          type: boolean
          description: True only if the translation exists and the requester may view it. Missing and denied translations both report false.
        current:
          type: boolean
          description: Matches negotiatedLanguage, even when the rendered entity falls back.
        url:
          type: string
          description: Site-relative Drupal request URI with base path removed, or an absolute external URL. The frontend maps this to its public URL. Unavailable entries use Code Component fallback URL semantics; their URLs are not guaranteed to be viewable.
        external:
          type: boolean
          description: External URLs are not valid content API or SDK fetchPage input. This does not imply domain negotiation support in the SDK.

    RoutedEntityRef:
      type: object
      additionalProperties: false
      required: [entityType, bundle, id, uuid, langcode]
      properties:
        entityType:
          type: string
        bundle:
          type: string
        id:
          type: string
        uuid:
          type: string
          format: uuid
        langcode:
          type: string

    FrontendEntry:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Absolute http(s) URL without trailing slash.
        components:
          type: array
          items:
            type: string
        cacheInvalidation:
          type: boolean
          description: >-
            Whether invalidated cache tags are announced to the frontend.
            Always present in responses.
        cacheInvalidationStatus:
          description: >-
            Present in responses only. Null when `cacheInvalidation` is false, or
            when the current user lacks the `administer canvas headless
            frontends` permission.
          readOnly: true
          oneOf:
            - $ref: '#/components/schemas/CacheInvalidationStatus'
            - type: 'null'

    CacheInvalidationStatus:
      type: object
      additionalProperties: false
      required: [state, lastSuccess, lastFailure, lastError, failures]
      properties:
        state:
          type: string
          enum: [ok, failing, idle]
          description: >-
            `failing` after an announcement failed or was not read, until the
            frontend has read an announcement that expires everything; `idle`
            while the frontend has never read announced cache tags; `ok`
            otherwise.
        lastSuccess:
          oneOf:
            - type: integer
            - type: 'null'
          description: Unix time the frontend last read announced cache tags.
        lastFailure:
          oneOf:
            - type: integer
            - type: 'null'
          description: Unix time of the last failure.
        lastError:
          oneOf:
            - type: string
            - type: 'null'
          description: The error of the last failure, if none succeeded since.
        failures:
          type: integer
          minimum: 0
          description: The number of consecutive failures.

    CacheInvalidationTestResult:
      type: object
      additionalProperties: false
      required: [ok, announced, read, message]
      properties:
        ok:
          type: boolean
          description: Whether the frontend read the announced cache tags.
        announced:
          type: boolean
          description: Whether the frontend accepted the announcement.
        read:
          type: boolean
          description: >-
            Whether the frontend read the announced cache tags from Drupal
            within five seconds.
        message:
          type: string
          description: The outcome, for display.

    FrontendsPayload:
      type: object
      additionalProperties: false
      required: [frontends]
      properties:
        frontends:
          type: array
          items:
            $ref: '#/components/schemas/FrontendEntry'

    SyncFrontendRequest:
      type: object
      additionalProperties: false
      required: [frontendUrl]
      properties:
        frontendUrl:
          type: string
          format: uri

    ComponentMetadataPayload:
      type: object
      additionalProperties: false
      required: [version, components, warnings]
      properties:
        version:
          type: integer
          enum: [1]
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentMetadataEntry'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ComponentMetadataWarning'

    ComponentMetadataEntry:
      allOf:
        - $ref: '../../openapi.yml#/components/schemas/CodeComponent'
        - type: object
          required:
            - machineName
            - name
            - status
            - required
            - props
            - slots
            - relativeDirectory
          properties:
            relativeDirectory:
              type: string
              description: Directory relative to the configured component root.

    ComponentMetadataWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
          description: Project-root-relative path associated with the warning.

    SyncCompleteRequest:
      type: object
      additionalProperties: false
      required: [frontendUrl, payload]
      properties:
        frontendUrl:
          type: string
          format: uri
        payload:
          $ref: '#/components/schemas/ComponentMetadataPayload'

    SyncFailRequest:
      type: object
      additionalProperties: false
      required: [frontendUrl]
      properties:
        frontendUrl:
          type: string
          format: uri
        message:
          type: string

    SyncResult:
      type: object
      additionalProperties: false
      required: [created, updated, unchanged, warnings, errors, components]
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        components:
          type: array
          items:
            type: string

    ErrorMessage:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    DrupalErrorMessage:
      type: object
      additionalProperties: true
      required: [message]
      properties:
        message:
          type: string

    ProblemDetails:
      type: object
      # RFC 9457 section 3.2 permits extension members, so additional
      # properties must not be forbidden here.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        cacheTags:
          description: Present on 403 and 404 responses.
          $ref: '#/components/schemas/CacheTags'
        cacheMaxAge:
          description: Present on 403 and 404 responses.
          $ref: '#/components/schemas/CacheMaxAge'

  responses:
    # Only the content API converts errors to Problem Details.
    # @see \Drupal\canvas_headless\EventSubscriber\CanvasContentResponseSubscriber::convertError()
    ProblemDetailsResponse:
      description: RFC 9457 Problem Details error response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    # The remaining routes are handled by Drupal's generic exception handling,
    # which negotiates the response format from the request. Unlike the rest of
    # the Canvas API, these route names are not prefixed with `canvas.api.`, so
    # ApiExceptionSubscriber does not shape them into JSON:API-style errors
    # either.
    # @see \Drupal\canvas\EventSubscriber\ApiExceptionSubscriber::onException()
    # @see \Drupal\Core\EventSubscriber\ExceptionJsonSubscriber::on4xx()
    DrupalErrorResponse:
      description: |
        Error response produced by Drupal's generic exception handling. The body
        format follows request format negotiation: an HTML error page by
        default, or a JSON object with a `message` when the request negotiates
        JSON (for example with `?_format=json`). Access denied responses raised
        before the controller runs, such as failed permission or CSRF token
        checks, are always HTML.
      content:
        text/html:
          schema:
            type: string
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/DrupalErrorMessage'

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token obtained from Drupal's `/session/token` endpoint.
      schema:
        type: string

  securitySchemes:
    DrupalSessionCookie:
      type: apiKey
      in: header
      name: Cookie
      description: |
        Drupal session cookie header. The cookie name is site-specific and the
        browser normally sends it automatically for same-origin requests.
