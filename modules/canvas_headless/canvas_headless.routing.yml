# Public redirect-or-content endpoint. Middleware rewrites GET requests to the
# Drupal URI supplied by `requestUri`; other methods reach this route and get 405.
canvas_headless.content:
  path: '/canvas/content-api'
  defaults:
    _controller: 'Drupal\canvas_headless\Controller\CanvasContentController::get'
  methods: [GET]
  requirements:
    _access: 'TRUE'

# Session renewal. Same-origin JSON endpoint for the Canvas editor's
# JavaScript: it fetches a fresh assertion here and relays it into the
# embedded app via postMessage. POST with header-based CSRF protection,
# following the Canvas UI's existing pattern of sending the X-CSRF-Token
# header obtained from core's /session/token endpoint.
#
# Both routes accept only cookie authentication: the Drupal session is the
# documented revocation boundary of the whole preview flow, so only that
# session may mint assertions. Without the restriction, Simple OAuth's
# global authentication provider would let any bearer token holding the
# preview permission call these endpoints and chain itself into fresh
# assertions, outliving the session.
canvas_headless.assertion:
  path: '/canvas-headless/assertion'
  defaults:
    _controller: 'Drupal\canvas_headless\Controller\AssertionController::mint'
  methods: [POST]
  requirements:
    _permission: 'access canvas headless preview'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE
    _auth: ['cookie']

# Standalone-tab renewal: a top-level navigation (the one request shape that
# still carries Drupal's SameSite=Lax session cookie from another site) that
# mints a fresh preview URL for the given path and redirects back into the
# app. No CSRF token — it is reached by a plain link from the frontend; the
# redirect target is the configured frontend URL, so the request cannot
# choose the destination site.
canvas_headless.renew:
  path: '/canvas-headless/renew'
  defaults:
    _controller: 'Drupal\canvas_headless\Controller\AssertionController::renew'
  methods: [GET]
  requirements:
    _permission: 'access canvas headless preview'
  options:
    no_cache: TRUE
    _auth: ['cookie']

# Frontend list management for the Canvas UI's headless frontends screen.
# GET returns the ordered list; PATCH replaces it wholesale, which matches
# the screen's model of managing the whole list at once. Cookie-only
# authentication and the CSRF request header follow the assertion route
# above: only a Drupal session may change which sites the editor embeds.
canvas_headless.frontends.get:
  path: '/canvas/api/v0/headless/frontends'
  defaults:
    _controller: 'Drupal\canvas_headless\Controller\FrontendsController::get'
  methods: [GET]
  requirements:
    _permission: 'administer canvas headless frontends'
  options:
    no_cache: TRUE
    _auth: ['cookie']

canvas_headless.frontends.patch:
  path: '/canvas/api/v0/headless/frontends'
  defaults:
    _controller: 'Drupal\canvas_headless\Controller\FrontendsController::patch'
  methods: [PATCH]
  requirements:
    _permission: 'administer canvas headless frontends'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE
    _auth: ['cookie']

# SPIKE PROTOTYPE for the headless-static-builds proposal: a public,
# published-only list of the paths Canvas renders, for build tools, sitemap
# generators, and other clients that must walk the site. Open access like the
# content endpoint above; the response reflects the requesting account's
# entity access, so an anonymous request sees exactly the anonymous view.
canvas_headless.inventory:
  path: '/canvas/api/v0/headless/inventory'
  defaults:
    _controller: 'Drupal\canvas_headless\Controller\RouteInventoryController::get'
  methods: [GET]
  requirements:
    _access: 'TRUE'

# The browser coordinates component synchronization because it can reach the
# same frontend URL it embeds. Drupal issues the proof-by-redemption assertion,
# validates and persists the returned metadata, and records lifecycle
# notifications for the Canvas activity center.
canvas_headless.component_sync.start:
  path: '/canvas/api/v0/headless/components/sync/start'
  defaults:
    _controller: 'Drupal\canvas_headless\Controller\ExternalComponentSyncController::start'
  methods: [POST]
  requirements: &component_sync_requirements
    # Synchronization trusts the configured frontend as the metadata source,
    # so it uses the same permission that controls that trust relationship.
    # The assertion generator independently requires headless preview access.
    _permission: 'administer canvas headless frontends'
    _csrf_request_header_token: 'TRUE'
  options: &component_sync_options
    no_cache: TRUE
    _auth: ['cookie']

canvas_headless.component_sync.complete:
  path: '/canvas/api/v0/headless/components/sync/complete'
  defaults:
    _controller: 'Drupal\canvas_headless\Controller\ExternalComponentSyncController::complete'
  methods: [POST]
  requirements:
    <<: *component_sync_requirements
  options:
    <<: *component_sync_options

canvas_headless.component_sync.fail:
  path: '/canvas/api/v0/headless/components/sync/fail'
  defaults:
    _controller: 'Drupal\canvas_headless\Controller\ExternalComponentSyncController::fail'
  methods: [POST]
  requirements:
    <<: *component_sync_requirements
  options:
    <<: *component_sync_options
