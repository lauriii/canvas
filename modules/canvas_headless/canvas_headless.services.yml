services:
  _defaults:
    autoconfigure: true
    autowire: true
  cache_context.canvas_headless_content_format:
    class: Drupal\canvas_headless\Cache\HeadlessContentFormatCacheContext
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  Drupal\canvas_headless\PreviewAssertionFactoryInterface:
    class: Drupal\canvas_headless\PreviewAssertionFactory
  Drupal\canvas_headless\PreviewUrlGeneratorInterface:
    class: Drupal\canvas_headless\PreviewUrlGenerator
  Drupal\canvas_headless\StackMiddleware\CanvasContentApiRequest:
    autowire: false
    tags:
      - { name: http_middleware, priority: 150 }
  Drupal\canvas_headless\PageCache\DisallowCanvasContentApiRequests:
    arguments:
      $languagePathProcessor: '@?path_processor_language'
  Drupal\canvas_headless\Routing\CanvasContentRouteEnhancer:
    tags:
      - { name: route_enhancer, priority: -1000 }
  Drupal\canvas_headless\Routing\DetachedPreviewRouteProcessor:
    tags:
      - { name: path_processor_inbound, priority: -1000 }
  Drupal\canvas_headless\EventSubscriber\PreviewLanguageSubscriber:
    arguments:
      $languagePathProcessor: '@?path_processor_language'
  Drupal\canvas_headless\EventSubscriber\CanvasContentResponseSubscriber: {}
  Drupal\canvas_headless\EventSubscriber\DetachedPreviewRouteSubscriber: {}
  Drupal\canvas_headless\EventSubscriber\EmbeddedPreviewSubscriber: {}
  Drupal\canvas_headless\CanvasContentEntityRenderer: {}
  Drupal\canvas_headless\CanvasContentTranslationLinks:
    arguments:
      $negotiator: '@?language_negotiator'
  Drupal\canvas_headless\CanvasContentHeadBuilder:
    arguments:
      $metatagManager: '@?metatag.manager'
  Drupal\canvas_headless\CanvasContentContextBuilder: {}
  Drupal\canvas_headless\Access\PreviewCeilingAccessPolicy:
    tags:
      - { name: access_policy }
  Drupal\canvas_headless\Access\NodePreviewAccessCheck:
    decorates: access_check.node.preview
    decoration_on_invalid: ignore
    arguments:
      $inner: '@Drupal\canvas_headless\Access\NodePreviewAccessCheck.inner'
  Drupal\canvas_headless\ExternalComponentSync: {}
  Drupal\canvas_headless\Controller\ExternalComponentSyncController: {}
  Drupal\canvas_headless\CanvasContentSerializer: {}
  Drupal\canvas_headless\RenderConverter\CanvasRenderConverter:
    tags:
      # After Custom Element passthrough (100), before built-in Canvas conversion (50).
      - { name: custom_elements.render_converter, priority: 60 }
  Drupal\canvas_headless\JsonRender\CanvasJsonRenderNormalizer:
    tags:
      - { name: custom_elements.format_normalizer }
  Drupal\canvas_headless\Controller\CanvasContentController: {}
  Drupal\canvas_headless\Controller\CanvasEntityController: {}
  Drupal\canvas_headless\File\CanvasContentFileUrlGenerator:
    decorates: file_url_generator
