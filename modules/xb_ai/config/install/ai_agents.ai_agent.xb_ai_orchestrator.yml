      values: ''
    entity_id:
      action: ''
      hide_property: 0
      values: ''
    selected_component:
      action: ''
      hide_property: 0
      values: ''
    layout:
      action: ''
      hide_property: 0
      values: ''
  'ai_agents::ai_agent::experience_builder_component_agent':
