    prompt:
      action: ''
      hide_property: 0
      values: ''
    files:
      action: ''
      hide_property: 0
      values: ''
  'ai_agents::ai_agent::experience_builder_page_builder_agent':
    prompt:
      action: ''
      hide_property: 0
      values: ''
    files:
      action: ''
      hide_property: 0
      values: ''
  'ai_agents::ai_agent::experience_builder_title_generation_agent':
