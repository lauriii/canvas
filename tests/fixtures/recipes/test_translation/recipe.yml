# cspell:ignore région
name: 'Test Translation'
description: 'Creates canvas page and content template entities with French translations for testing translation scenarios'
type: 'Canvas'
install:
  - language
  - content_translation
config:
  strict: false
  import:
    canvas: '*'
  actions:
    # Ensure en exists so language prefix routing is enabled; recipe install skips
    # language.entity.en.yml, so create it if missing.
    language.entity.en:
      createIfNotExists:
        langcode: en
        status: true
        dependencies: {  }
        id: en
        label: English
        direction: ltr
        weight: 0
        locked: false
    language.entity.fr:
      create:
        id: fr
        label: French
    language.entity.es:
      create:
        id: es
        label: Spanish
    # Canvas ships this config in config/optional (language_alterable: true),
    # and the wildcard import above already imports it, so `create` would
    # collide. The fallback values mirror the shipped file.
    language.content_settings.canvas_page.canvas_page:
      createIfNotExists:
        target_entity_type_id: canvas_page
        target_bundle: canvas_page
        default_langcode: site_default
        language_alterable: true
      setThirdPartySetting:
        module: content_translation
        key: enabled
        value: true
    # The chrome page variant renders every page; select it as the site
    # default so its heading appears around the test pages.
    canvas.settings:
      simpleConfigUpdate:
        default_page_variant: chrome
    # @todo Remove setLanguageOverride and replace with config/language/{langcode}/
    #   files once https://drupal.org/i/3453331 is fixed.
    canvas.page_variant.chrome:
      setLanguageOverride:
        language: fr
        data:
          component_tree:
            33333333-3333-4333-8333-333333333333:
              label: 'French region heading'
              inputs:
                text: 'Bonjour de la région'
