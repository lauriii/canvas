$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Page section
description: A page section that other links can target with `#anchor`.
props:
  type: object
  required:
    - heading
  properties:
    heading:
      type: string
      title: Heading
      examples:
        - Pricing
    anchor:
      type: string
      title: Anchor
      description: Lets links on this page jump here with "#" followed by this value.
      examples:
        - pricing
slots:
  content:
    title: Content
