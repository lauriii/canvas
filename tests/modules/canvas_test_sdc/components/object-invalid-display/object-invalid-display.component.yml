$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Object display on props that do not support it
props:
  type: object
  properties:
    heading:
      title: 'Heading'
      type: string
      x-canvas-object-display: inline
      examples:
        - Hello
    links:
      title: 'Links'
      type: array
      x-canvas-object-display: inline
      items:
        type: object
        properties:
          text:
            title: 'Text'
            type: string
    button:
      title: 'Button'
      type: object
      x-canvas-object-display: accordion
      properties:
        text:
          title: 'Text'
          type: string
