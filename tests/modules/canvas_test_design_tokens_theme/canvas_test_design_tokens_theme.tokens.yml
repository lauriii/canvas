# @see \Drupal\canvas\DesignToken\BrandKitTokens
color:
  $type: color
  $description: 'Brand colors'
  palette:
    violet:
      $value: '#7C3AED'
  semantic:
    $description: 'Colors by role'
    primary:
      $value: '#0055aa'
    # Aliases are not supported by core yet: this token is dropped.
    accent:
      $value: '{color.palette.violet}'
font:
  heading:
    $type: fontFamily
    $value: [Georgia, serif]
  body:
    $type: fontFamily
    $value: ['Font 3', serif]
spacing:
  $type: dimension
  $description: 'Spacing scale'
  sm:
    $value: { value: 8, unit: px }
  md:
    $value: { value: 16, unit: px }
type:
  heading:
    $type: typography
    $value:
      fontFamily: [Georgia, serif]
      fontSize: { value: 32, unit: px }
      fontWeight: 700
      letterSpacing: { value: -0.5, unit: px }
      lineHeight: 1.2
