$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Focal point image
status: stable
props:
  type: object
  required:
    - image
  properties:
    image:
      title: Image
      type: object
      $ref: json-schema-definitions://canvas.module/image-with-focal-point
      examples:
        - src: https://placehold.co/1200x600.png
          alt: 'A placeholder'
          width: 1200
          height: 600
    gallery:
      title: Gallery
      type: array
      items:
        $ref: json-schema-definitions://canvas.module/image-with-focal-point
        type: object
