js:
  original: |
    import { Image } from 'drupal-canvas';

    const FocalPointImage = ({ image, focalPoint, gallery = [], galleryFocalPoints = [] }) => (
      <div>
        <Image {...image} focalPoint={focalPoint} style={{ width: 300, height: 150 }} />
        {gallery.map((item, i) => (
          <Image key={i} {...item} focalPoint={galleryFocalPoints[i]} style={{ width: 100, height: 100 }} />
        ))}
      </div>
    );

    export default FocalPointImage;
