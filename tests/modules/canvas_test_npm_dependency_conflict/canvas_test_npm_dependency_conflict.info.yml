name: 'Test Canvas npm dependency conflict'
type: module
description: 'Declares the same npm package as canvas_test_npm_dependency at a different version.'
package: Testing
dependencies:
  - canvas:canvas
canvas:
  npm:
    '@canvas-test/declared-package': 1.3.0
    # Higher, but not forced: the other module's forced 2.0.0 wins.
    '@canvas-test/required-client': 2.1.0
