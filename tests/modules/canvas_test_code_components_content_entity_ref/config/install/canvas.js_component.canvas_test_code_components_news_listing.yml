      import { Image, FormattedText } from 'drupal-canvas';

      const NewsListing = ({ heading, featuredNews }) => {
        const {
          label,
          body,
          path,
          owner: { name: authorName, user_picture: authorPicture } = {},
        } = featuredNews ?? {};

        return (
          <section>
            <h2>{heading}</h2>
            <article>
              <h3>
                <a href={path}>{label}</a>
              </h3>
              <div className="flex items-center gap-2">
                {authorPicture?.src_with_alternate_widths && (
                  <Image
                    src={authorPicture.src_with_alternate_widths}
                    alt={authorPicture.alt ?? ''}
                    width={authorPicture.width}
                    height={authorPicture.height}
                    style={{
                      width: 40,
                      height: 40,
                      borderRadius: '50%',
                      objectFit: 'cover',
                    }}
                  />
                )}
                <span>By {authorName}</span>
              </div>
              {body && (
                <FormattedText as="div" className="prose">
                  {body}
                </FormattedText>
              )}
            </article>
          </section>
        );
      };
      export default NewsListing;
