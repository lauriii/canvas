  original: |
    // See https://project.pages.drupalcode.org/canvas/ for documentation on how to build a code component

    const Component = ({
      text = "Three Colors",
      free,
      brandPastel,
      brandNeon,
      brandAll,
      brandTwoFolders,
    }) => {
        const colorData = (color) => {return <div><span data-css-color-value>{color.cssColorValue}</span> | <span data-css-var>{color.cssVariable}</span> | <span data-color-name>{color.colorName}</span> | <span data-color-space>{color?.value?.colorSpace}</span></div>}

      return (
        <>
        <div data-color-free className="text-1xl flex">
          Free: <div style={{margin: '4px',backgroundColor: free.cssColorValue, height: '16px', width: '16px'}}></div>
          {colorData(free)}
        </div>
          <div data-color-pastel className="text-1xl flex">
          Brand Pastel <div style={{margin: '4px',backgroundColor: brandPastel.cssColorValue, height: '16px', width: '16px'}}></div>
                  {colorData(brandPastel)}

        </div>
           <div data-color-neon className="text-1xl flex">
          Brand Neon: <div style={{margin: '4px',backgroundColor: brandNeon.cssColorValue, height: '16px', width: '16px'}}></div>
                   {colorData(brandNeon)}

        </div>
         <div data-color-two className="text-1xl flex">
          Brand Two Folders: <div style={{margin: '4px',backgroundColor: brandTwoFolders.cssColorValue, height: '16px', width: '16px'}}></div>
                 {colorData(brandTwoFolders)}

        </div>
          <div data-color-all className="text-1xl flex">
          Brand All Colors: <div style={{margin: '4px',backgroundColor: brandAll.cssColorValue, height: '16px', width: '16px'}}></div>
                  {colorData(brandAll)}

        </div>
          <div data-css-vars>
                <h2>CSS VARS EXAMPLE</h2>
                <div data-var-pastel style={{margin: '4px',backgroundColor: `var(${brandPastel.cssVariable})`, border: '1px solid black'}}>PASTEL</div>
                <div data-var-neon style={{margin: '4px',backgroundColor: `var(${brandNeon.cssVariable})`, border: '1px solid black'}}>NEON</div>

          </div>
        </>
      );
    };

    export default Component;
