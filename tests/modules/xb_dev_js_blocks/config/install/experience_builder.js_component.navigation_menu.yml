    export default function NavigationMenu({ id, label, links }) {
      const headingID = id + '--heading';
      return (
        <nav role="navigation" aria-labelledby={headingID}>
          <h2 id={headingID} className="visually-hidden">{label}</h2>
          <Menu links={links} />
        </nav>
      )
    }

    function Menu({ links }) {
      return(
        <ul>
          { links.map(({ key, title, url, isExpanded, isCollapsed, inActiveTrail, submenu }) =>
            <li key={key}>
              <a href={url}>{title}</a>
              { submenu && <Menu links={submenu.links} /> }
            </li>
          )}
        </ul>
      )
    }
