$schema: https://git.drupalcode.org/project/sdc/-/raw/1.x/src/metadata.schema.json
name: All props
props:
  type: object
  required:
    - test-REQUIRED-string
  properties:
    test-string:
      title: 'String'
      type: string
    test-REQUIRED-string:
      title: 'String'
      type: string
    test-string-enum:
      title: 'String'
      type: string
      enum:
        - foo
        - bar
    # Built-in formats: dates and times
    # @see https://json-schema.org/understanding-json-schema/reference/string#dates-and-times
    test-string-format-date-time:
      type: string
      format: date-time
    test-string-format-date:
      type: string
      format: date
    test-string-format-time:
      type: string
      format: time
    test-string-format-duration:
      type: string
      format: duration
    # Built-in formats: email addresses.
    # @see https://json-schema.org/understanding-json-schema/reference/string#email-addresses
    test-string-format-email:
      type: string
      format: email
    test-string-format-idn-email:
      type: string
      format: idn-email
    # Built-in formats: hostnames.
    # @see https://json-schema.org/understanding-json-schema/reference/string#hostnames
    test-string-format-hostname:
      type: string
      format: hostname
    test-string-format-idn-hostname:
      type: string
      format: idn-hostname
    # Built-in formats: IP addresses.
    # @see https://json-schema.org/understanding-json-schema/reference/string#ip-addresses
    test-string-format-ipv4:
      type: string
      format: ipv4
    test-string-format-ipv6:
      type: string
      format: ipv6
    # Built-in formats: resource identifiers.
    # @see https://json-schema.org/understanding-json-schema/reference/string#resource-identifiers
    test-string-format-uuid:
      type: string
      format: uuid
    test-string-format-uri:
      title: 'String, format=uri'
      type: string
      format: uri
    test-string-format-uri-image:
      title: 'String, format=uri, images only'
      $ref: json-schema-definitions://experience_builder.module/image-uri
      # @todo Remove in https://www.drupal.org/project/drupal/issues/3352063 — should not be necessary, but removing this causes \Drupal\Core\Theme\Component\ComponentMetadata::parseSchemaInfo() to generate `type = ['', 'object'] 🐛
      type: string
      # ⚠️ The reference above is equivalent to:
      # type: string
      # format: uri
      # # @see \Drupal\image\Plugin\Field\FieldType\ImageItem::defaultFieldSettings()
      # pattern: '\.(png|gif|jpg|jpeg|webp)$'
    test-string-format-uri-reference:
      type: string
      format: uri-reference
    test-string-format-iri:
      type: string
      format: iri
    test-string-format-iri-reference:
      type: string
      format: iri-reference
    # Built-in formats: URI template.
    # @see https://json-schema.org/understanding-json-schema/reference/string#uri-template
    test-string-format-uri-template:
      type: string
      format: uri-template
    # Built-in formats: JSON Pointer.
    # @see https://json-schema.org/understanding-json-schema/reference/string#json-pointer
    test-string-format-json-pointer:
      type: string
      format: json-pointer
    test-string-format-relative-json-pointer:
      type: string
      format: relative-json-pointer
    # Built-in formats: Regular expressions.
    # @see https://json-schema.org/understanding-json-schema/reference/string#regular-expressions
    test-string-format-regex:
      type: string
      format: regex

    test-integer:
      type: integer
    test-integer-range-minimum:
      type: integer
      minimum: 0
    test-integer-range-minimum-maximum-timestamps:
      type: integer
      minimum: -2147483648
      maximum: 2147483648

    # The "image" predefined object format.
    # @todo Agree on one special case, for ecosystem-wide formats: `json-schema-definitions://drupal/<something>`, so `json-schema-definitions://drupal/image` here.
    test-object-drupal-image:
      $ref: json-schema-definitions://experience_builder.module/image
      # @todo Remove in https://www.drupal.org/project/drupal/issues/3352063 — should not be necessary, but removing this causes \Drupal\Core\Theme\Component\ComponentMetadata::parseSchemaInfo() to generate `type = ['', 'object'] 🐛
      type: object

    # The "date-range" object format for this module.
    test-object-drupal-date-range:
      $ref: json-schema-definitions://sdc_test_all_props.module/date-range
      # @todo Remove in https://www.drupal.org/project/drupal/issues/3352063 — should not be necessary, but removing this causes \Drupal\Core\Theme\Component\ComponentMetadata::parseSchemaInfo() to generate `type = ['', 'object'] 🐛
      type: object

    #
    # @todo finish adding all other types + formats supported by JSON schema
    #
