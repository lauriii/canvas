$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero
description: A test component with props and slots
libraryOverrides:
  dependencies:
    - core/once
props:
  type: object
  required:
    - heading
  properties:
    heading:
      type: string
      title: Heading
      description: The main heading of the hero
      minLength: 2
      examples:
        - There goes my hero
        - Submit now
    attributes:
      type: Drupal\Core\Template\Attribute
      name: Attributes
slots:
  the_body:
    title: The Body
    description: The contents of the body.
    examples:
      - <p>Foo is <strong>NOT</strong> bar.</p>
