experience_builder.component.*:
  type: config_entity
  constraints:
    FullyValidatable: ~
  mapping:
    label:
      type: required_label
      label: 'Label'
    status:
      # Refine `type: config_entity`'s `status`: only allow `true` for SDCs/Blocks that meet the requirements.
      constraints: {
      # @todo Write validation constraint per above comment in https://www.drupal.org/project/experience_builder/issues/3473289
      }
    id:
      # This ID intentionally does not use `type: machine_name`, because it is a composite ID that is better validated
      # using the `StringParts` constraint than the `RegEx` constraint.
      type: string
      label: 'Component'
      constraints:
        StringParts:
          separator: .
          reservedCharacters:
            - ':'
          reservedCharactersSubstitute: .
          parts:
            - '%parent.source'
            - '%parent.settings.plugin_id'
        Length:
          # @see \Drupal\Core\Config\Entity\ConfigEntityStorage::MAX_ID_LENGTH
          max: 166
    source:
      type: string
      label: 'Source plugin'
      constraints:
        Regex:
          pattern: '/^[a-z0-9_]+$/'
          message: 'The %value source plugin ID is not valid.'
        PluginExists:
          manager: Drupal\experience_builder\ComponentSource\ComponentSourceManager
          interface: '\Drupal\experience_builder\ComponentSource\ComponentSourceInterface'
    category:
      type: required_label
      label: 'Category'
    settings:
      type: experience_builder.component_source_settings.[%parent.source]

# At most a single entity of this type is allowed to exist. If it exists, it *replaces* the theme's `page.html.twig`.
experience_builder.global_page_template.*:
  type: config_entity
  constraints:
    FullyValidatable: ~
  mapping:
    # A single component tree.
    component_tree:
      # @todo This MUST contain a single XB Component that points to the title block, main content block and messages block
      # @see \Drupal\Core\Block\MainContentBlockPluginInterface
      # @see \Drupal\Core\Block\TitleBlockPluginInterface
      # @see \Drupal\Core\Block\MessagesBlockPluginInterface
      # @todo Blocked on Blocks-as-XB-Components: https://www.drupal.org/project/experience_builder/issues/3475584
      type: experience_builder.component_tree
      label: 'The component tree that represents the default page'

# Otherwise, an Experience Builder Page Template can be created per installed theme, and stores component trees for each
# region in a theme's `page.html.twig`.
experience_builder.page_template.*:
  type: config_entity
  constraints:
    FullyValidatable: ~
  mapping:
    # Regions are theme-specific.
    theme:
      type: string
      label: 'Theme'
      constraints:
        NotBlank: [ ]
        ExtensionName: [ ]
        ExtensionExists: theme
    # There must be a component tree (or null) specified for each region in this theme.
    component_trees:
      type: sequence
      orderby: key
      constraints:
        # Each theme has a different set of regions. For an XB Page Template to be complete and considered valid, every
        # region must be explicitly present.
        KeyForEveryThemeRegion: "%parent.theme"
        ComponentTreeMeetRequirements:
          nested: true
          # Only StaticPropSources may be used, because the Page Template cannot rely on an entity of a particular type
          # and bundle to be present on every route.
          props:
            absence:
              - dynamic
              - adapter
            presence: ~
          # Somewhere in one one the component trees, 3 block plugins MUST be present, because they are essential.
          # @see \Drupal\experience_builder\Plugin\DisplayVariant\PageTemplateDisplayVariant
          tree:
            absence: ~
            presence:
              # In core: `block.system_main_block`. Contrib/custom modules may add additional implementations.
              - Drupal\Core\Block\MainContentBlockPluginInterface
              # In core: `block.page_title_block`. Contrib/custom modules may add additional implementations.
              - Drupal\Core\Block\TitleBlockPluginInterface
              # In core: `block.system_messages_block`. Contrib/custom modules may add additional implementations.
              - Drupal\Core\Block\MessagesBlockPluginInterface
      sequence:
        # A region that is left empty may be `null`.
        nullable: true
        # All non-empty regions must have a component tree defined.
        type: experience_builder.component_tree

# The config equivalent of a ComponentTreeItem, validated by the same constraint.
# @todo Use this in https://www.drupal.org/project/experience_builder/issues/3455629
experience_builder.component_tree:
  type: mapping
  label: 'Config-Defined Component Tree'
  constraints:
    ValidComponentTree: ~
    FullyValidatable: ~
  # @see \Drupal\experience_builder\Plugin\Field\FieldType\ComponentTreeItem::propertyDefinitions()
  mapping:
    # @see \Drupal\experience_builder\Plugin\DataType\ComponentTreeStructure
    tree:
      type: label
      label: 'A component tree without props values.'
      constraints:
        ComponentTreeStructure: []
    # @see \Drupal\experience_builder\Plugin\DataType\ComponentPropsValues
    props:
      type: string
      label: 'Prop values for each component in the component tree'

experience_builder.component_source_settings.sdc:
  constraints:
    FullyValidatable: ~
  type: mapping
  label: 'SDC component settings'
  mapping:
    # @see \Drupal\Core\Plugin\Component::$machineName
    plugin_id:
      type: string
      label: 'Component ID'
      constraints:
        NotBlank: []
        Regex:
          pattern: '/^[a-z0-9_-]+:[a-z0-9_-]+$/'
          message: 'The %value machine name is not valid.'
        PluginExists:
          manager: plugin.manager.sdc
          interface: 'Drupal\Core\Plugin\PluginBase'
    props:
      type: sequence
      orderby: key
      constraints:
        KeyForEverySdcProp: "%parent.plugin_id"
      sequence:
        type: mapping
        # For each SDC prop, first a field type must be picked from the list of possible choices provided by \Drupal\experience_builder\ShapeMatcher\FieldForComponentSuggester
        mapping:
          field_type:
            type: string
            label: 'Default field type'
            constraints:
              PluginExists:
                manager: plugin.manager.field.field_type
                interface: '\Drupal\Core\Field\FieldItemInterface'
          field_storage_settings:
            type: field.storage_settings.[%parent.field_type]
            # Optional *if* the default storage settings should be used.
            requiredKey: false
          field_instance_settings:
            type: field.field_settings.[%parent.field_type]
            # Optional *if* the default instance settings should be used.
            requiredKey: false
          # After a field type is selected, a field widget must be picked.
          # @todo MUCH later: widget settings.
          field_widget:
            type: string
            label: 'Default field widget'
            constraints:
              PluginExists:
                manager: plugin.manager.field.widget
                interface: '\Drupal\Core\Field\WidgetInterface'
          # Then finally, a default value must be picked for every REQUIRED prop, using the aforementioned widget.
          # This value uses the field type's default value config schema, and will be simplified to a
          # StaticPropSource's `value`.
          # @see \Drupal\experience_builder\PropSource\StaticPropSource::denormalizeValue()
          # @see \Drupal\experience_builder\PropSource\StaticPropSource::isMinimalRepresentation()
          default_value:
            type: field.value.[%parent.field_type]
            label: 'Default value'
            # @todo Add validation constraint because this is only *conditionally* nullable: if the SDC prop is optional
            nullable: true
          # The default value must be retrievable
          expression:
            type: string
            label: ''
            constraints: { }
            # @todo Add `StructuredDataPropExpression` validation constraint that fails if StructuredDataPropExpression::fromString() fails
            # StructuredDataPropExpression: [field_type]

# This is similar to Block config entities, but different:
# - Block config entities are tied to a particular theme + region (and have a weight to convey position in a region), Block-Plugins-as-XB-Components are not
# - Block config entities have visibility conditions that determines the visibility of that particular "placed block", Block-Plugins-as-XB-Components do not
# ⚠️ The XB equivalent of "visibility conditions" will be added when product requirement `41. Conditional display of components` is implemented, and it will not happen at the `Component` config entity level, but at the use/placement/instantiation level: in a component tree.
# @see https://docs.google.com/spreadsheets/d/1OpETAzprh6DWjpTsZG55LWgldWV_D8jNe9AM73jNaZo/edit?gid=1721130122#gid=1721130122&range=B53
# @see `type: block.block.*` in core/modules/block/config/schema/block.schema.yml
experience_builder.component_source_settings.block:
  constraints:
    FullyValidatable: ~
  type: mapping
  label: 'Block component settings'
  mapping:
    plugin_id:
      type: string
      label: 'Block plugin ID'
      constraints:
        PluginExists:
          manager: plugin.manager.block
          interface: Drupal\Core\Block\BlockPluginInterface
    settings:
      type: block.settings.[%parent.plugin_id]

field.value.component_tree:
  type: experience_builder.component_tree
  label: 'Default value'
  constraints:
    # The options for this constraint must match the options for the `ComponentTreeMeetRequirements` set in the field
    # type plugin.
    # @see \Drupal\experience_builder\Plugin\Field\FieldType\ComponentTreeItem
    ComponentTreeMeetRequirements:
      props:
        absence:
          - dynamic
          - adapter
        presence: ~
      tree:
        absence:
          - Drupal\Core\Block\MainContentBlockPluginInterface
          - Drupal\Core\Block\TitleBlockPluginInterface
          - Drupal\Core\Block\MessagesBlockPluginInterface
        presence: ~
    FullyValidatable: ~

field.field_settings.component_tree:
  type: field.field_settings.*
  constraints:
    FullyValidatable: ~

experience_builder.pattern.*:
  type: config_entity
  constraints:
    FullyValidatable: ~
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    # A single component tree.
    component_tree:
      constraints:
        ComponentTreeMeetRequirements:
          # Only StaticPropSources may be used, because a Pattern cannot rely on an entity of a particular type
          # and bundle to be present everywhere it is inserted/used.
          props:
            absence:
              - dynamic
              - adapter
            presence: ~
          tree:
            absence:
              # Components implementing either of these 3 interfaces are only
              # allowed to live at the PageTemplate level.
              # @see \Drupal\experience_builder\Entity\PageTemplate
              # @see `type: experience_builder.page_template.*`
              - Drupal\Core\Block\MainContentBlockPluginInterface
              - Drupal\Core\Block\TitleBlockPluginInterface
              - Drupal\Core\Block\MessagesBlockPluginInterface
            presence: ~
      type: experience_builder.component_tree
      label: 'The component tree that represents a reusable pattern'
experience_builder.settings:
  type: config_object
  label: 'Experience Builder settings'
  mapping:
    demo_mode:
      type: boolean
      label: 'Experience Builder demo mode'
