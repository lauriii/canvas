# @todo Remove when https://drupal.org/i/3387100 lands.
# Content translation provides schema for field.field.*.*.*.third_party.content_translation
# but not for core.base_field_override.*.*.*.third_party.content_translation.
core.base_field_override.*.*.*.third_party.content_translation:
  type: mapping
  label: 'Content translation field settings'
  mapping:
    translation_sync:
      type: sequence
      label: 'Field properties for which to synchronize translations'
      sequence:
        type: string
        label: 'Field column for which to synchronize translations'
