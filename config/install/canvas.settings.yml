default_page_variant: null
prop_forms:
  # Opt-in for native (client-side) prop forms. When FALSE (the default), every
  # component instance prop form is server-built via Form API, so
  # `hook_form_alter()` effects and media library contrib integrations apply.
  native: false
  # Widget plugin ids excluded from native rendering; their props render via
  # the server-built Drupal widget (the escape hatch) while all other props
  # stay native. Example: media_library_widget on sites using DAM integrations.
  disabled_widgets: {  }
