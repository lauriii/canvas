name: 'Canvas Stark'
type: theme
description: 'A theme for rendering forms in the Drupal Canvas UI. It includes logic that can bridges Drupal-rendered markup to React components.'
core_version_requirement: ^11.2
base theme: false
hidden: true

libraries-extend:
  ckeditor5/internal.drupal.ckeditor5:
    - canvas_stark/canvas.internal.drupal.ckeditor5

libraries-override:
  media_library/widget:
    js:
      js/media_library.widget.js: false
