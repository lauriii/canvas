'$schema': 'https://git.drupalcode.org/project/sdc/-/raw/1.x/src/metadata.schema.json'
name: Two Column
status: stable
group: Container
props:
  type: object
  required:
    - width
  properties:
    width:
      $ref: json-schema-definitions://experience_builder.module/column-width
      type: integer
      title: Column Width
      description: The width of the first column.
      examples: [25, 33, 50, 66, 75]
slots:
  column_one:
    title: Column One
    description: The contents of the first column.
    # @todo can_be_dropzone: true
    examples:
      - <p>This is column 1 content</p>
    # @todo this should be a dropzone
  column_two:
    title: Column Two
    description: The contents of the second column.
    # @todo can_be_dropzone: true
    examples:
      - <p>This is column 2 content</p>
    # @todo this should be a dropzone
